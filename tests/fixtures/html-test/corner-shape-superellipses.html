<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Corner shape superellipses</title>
<style>
  body { margin: 24px; font: 14px/1.3 sans-serif; background: #f7f7fb; color: #172033; }
  main { display: grid; grid-template-columns: repeat(3, 180px); gap: 22px; }
  figure { margin: 0; text-align: center; }
  .shape { box-sizing: border-box; width: 180px; height: 112px; border: 12px solid #273d8f; border-radius: 48px 34px; background: linear-gradient(135deg, #63d6c8, #f5d367); box-shadow: 0 7px 0 #d9ddec; }
  figcaption { margin-top: 10px; }
  .round { corner-shape: round; }
  .squircle { corner-shape: squircle; }
  .bevel { corner-shape: bevel; }
  .scoop { corner-shape: scoop; }
  .notch { corner-shape: notch; }
  .custom { corner-shape: superellipse(3); }
  .asymmetric { corner-top-left-shape: squircle; corner-top-right-shape: bevel; corner-bottom-right-shape: scoop; corner-bottom-left-shape: notch; border-radius: 58px 26px 44px 34px / 30px 48px 24px 42px; }
  .overlap { corner-shape: scoop; border-radius: 92px 0 92px 0; }
  .mixed-hyper { corner-shape: squircle; border-width: 8px 18px 14px 5px; border-color: #d92f65 #2866c7 #15996a #ee9b22; }
  .mixed-concave { corner-shape: scoop; border-width: 8px 18px 14px 5px; border-color: #d92f65 #2866c7 #15996a #ee9b22; }
  .tangent-overlap { width: 100px; corner-shape: scoop; border-radius: 68px; border-width: 9px 17px 15px 6px; border-color: #d92f65 #2866c7 #15996a #ee9b22; }
</style>
<body>
<h1>CSS corner-shape</h1>
<main>
  <figure><div class="shape round"></div><figcaption>round</figcaption></figure>
  <figure><div class="shape squircle"></div><figcaption>squircle</figcaption></figure>
  <figure><div class="shape bevel"></div><figcaption>bevel</figcaption></figure>
  <figure><div class="shape scoop"></div><figcaption>scoop</figcaption></figure>
  <figure><div class="shape notch"></div><figcaption>notch</figcaption></figure>
  <figure><div class="shape custom"></div><figcaption>superellipse(3)</figcaption></figure>
  <figure><div class="shape asymmetric"></div><figcaption>physical asymmetric</figcaption></figure>
  <figure><div class="shape overlap"></div><figcaption>opposite hull constraint</figcaption></figure>
  <figure><div class="shape mixed-hyper"></div><figcaption>mixed squircle sides</figcaption></figure>
  <figure><div class="shape mixed-concave"></div><figcaption>mixed scoop sides</figcaption></figure>
  <figure><div class="shape tangent-overlap"></div><figcaption>concave tangent overlap</figcaption></figure>
</main>
</body>
</html>
