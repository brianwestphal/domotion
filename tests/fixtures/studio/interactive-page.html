<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html,body{margin:0;width:100%;height:100%;font:16px system-ui;background:#f8fafc;color:#0f172a}
    main{padding:24px}.toolbar{display:flex;gap:12px;align-items:center}
    button,input{font:inherit;border:1px solid #94a3b8;border-radius:8px;padding:8px 12px;background:white}
    #panel{margin-top:18px;width:180px;padding:14px;border-radius:10px;background:#dbeafe;transition:width 120ms ease-out}
    #panel.wide{width:330px}.spacer{height:340px}#destination{padding:18px;background:#dcfce7}
  </style>
</head>
<body>
  <main>
    <div class="toolbar">
      <button aria-label="Open details">Open</button>
      <label>Search <input value=""></label>
      <button aria-label="Expand details">Expand</button>
    </div>
    <section id="panel" hidden>Details ready</section>
    <div class="spacer"></div>
    <div id="destination">Finished</div>
  </main>
  <script>
    document.querySelector('[aria-label="Open details"]').addEventListener('click',()=>{document.querySelector('#panel').hidden=false});
    document.querySelector('[aria-label="Expand details"]').addEventListener('click',()=>{document.querySelector('#panel').classList.add('wide')});
  </script>
</body>
</html>
