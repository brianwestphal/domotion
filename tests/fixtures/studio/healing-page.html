<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html,body{margin:0;width:100%;height:100%;font:16px system-ui;background:#f8fafc;color:#0f172a}
    main{padding:24px}.moved-actions{margin-left:210px;display:flex;gap:8px;align-items:end}
    label{display:grid;gap:4px;font-size:12px}button,input{font:inherit;border:1px solid #64748b;border-radius:8px;padding:9px 12px;background:white}
    #status{margin:34px 24px;padding:18px;border-radius:10px;background:#dbeafe;font-weight:650}
  </style>
</head>
<body>
  <main>
    <div class="moved-actions">
      <label>Workspace<input></label>
      <button>Start tour</button>
      <button>Start settings</button>
    </div>
    <div id="status" aria-live="polite">Waiting</div>
  </main>
  <script>
    document.querySelector('button').addEventListener('click',()=>{
      document.querySelector('#status').textContent='Loading';
      setTimeout(()=>{
        document.querySelector('#status').textContent='Ready';
        const finish=document.createElement('button');
        finish.textContent='Finish';
        finish.addEventListener('click',()=>{document.querySelector('#status').textContent='Flow complete'});
        document.querySelector('.moved-actions').append(finish);
      },2000);
    });
  </script>
</body>
</html>
