<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- DM-2087: deterministic second Linux oracle environment. The stock
       Playwright Noble image resolves the browser's `sans` UI preference to
       WenQuanYi Zen Hei. Prepending DejaVu Sans makes the same host question
       answer a different installed desktop family without changing code. -->
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <test name="family" qual="any"><string>sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
</fontconfig>
