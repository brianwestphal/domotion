<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Linux Unicode face-selection control. Every face the ten unratified
       raster-floor rows select in the pinned Playwright Noble image is
       rejected, so a selection path that really consults fontconfig (the
       declared-family matcher and the live per-codepoint resolver) must move,
       while anything that opened these files by hard-coded path would not. -->
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <selectfont>
    <rejectfont>
      <pattern><patelt name="family"><string>Liberation Sans</string></patelt></pattern>
      <pattern><patelt name="family"><string>WenQuanYi Zen Hei</string></patelt></pattern>
      <pattern><patelt name="family"><string>WenQuanYi Zen Hei Mono</string></patelt></pattern>
      <pattern><patelt name="family"><string>WenQuanYi Zen Hei Sharp</string></patelt></pattern>
      <pattern><patelt name="family"><string>FreeSans</string></patelt></pattern>
      <pattern><patelt name="family"><string>FreeSerif</string></patelt></pattern>
      <pattern><patelt name="family"><string>Unifont</string></patelt></pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
