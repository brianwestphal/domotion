<!DOCTYPE html>
<!-- Progress-install demo page. One terminal window whose `step(k)` helper
     drives the npm-install output forward: step(0) commits the command and
     paints the gradient progress track (revealed left-to-right by the frame's
     clipPath animation — see progress-install.json), then steps 1-3 land the
     completion lines one at a time. The animate config types the command as a
     `typing` overlay on frame 1, animates the bar on frame 2, then drives
     step(1..3) as the states of ONE compressed run (docs/100 Primitive 1 /
     docs/43 §11): the terminal chrome and the settled lines are emitted once
     and only the newly-revealed line animates in per state. -->
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #0d1117; font-family: "SF Mono", Menlo, Monaco, monospace; }
  .bar { height: 36px; background: #161b22; display: flex; align-items: center; gap: 8px; padding: 0 14px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .red { background: #ff5f56; } .yellow { background: #ffbd2e; } .green { background: #27c93f; }
  .title { margin-left: 8px; font-size: 12px; color: #6e7681; }
  .body { padding: 16px; font-size: 14px; line-height: 22px; color: #c9d1d9; white-space: pre; }
  .prompt { color: #3fb950; }
  .dim { color: #8b949e; }
  .ok { color: #3fb950; }
  .track { margin-top: 14px; width: 420px; height: 10px; background: #21262d; border-radius: 5px; overflow: hidden; }
  /* Full-width fill, revealed left-to-right by the intra-frame clipPath
     animation (see progress-install.json). Capturing it at full width gives
     the renderer real geometry to clip — animating CSS width% on a captured
     zero-width rect doesn't paint. */
  .bar-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #58a6ff, #a371f7); border-radius: 5px; }
</style>
</head>
<body>
  <div class="bar"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span><span class="title">zsh — ~/project</span></div>
  <div class="body" id="out"><span class="prompt">$</span> </div>
<script>
  var CMD = '<span class="prompt">$</span> npm install domotion-svg';
  var RESOLVING = '<span class="dim">Resolving dependencies…</span>\n    <div class="track"><div class="bar-fill"></div></div>';
  var ADDED = '<span class="ok">added 24 packages</span> <span class="dim">in 3s</span>';
  var READY = '<span class="ok">✓</span> domotion-svg ready to render';
  var PROMPT = '<span class="prompt">$</span> ';
  // step(0) paints the progress track; steps 1-3 append the completion output
  // one line at a time. Each step only APPENDS at the bottom — the settled
  // lines keep their positions so the compressed run pairs their glyphs cleanly
  // and animates just the newly-revealed line.
  var STEPS = [
    [CMD, "", RESOLVING],
    [CMD, "", ADDED],
    [CMD, "", ADDED, READY],
    [CMD, "", ADDED, READY, PROMPT],
  ];
  window.step = function (k) {
    document.getElementById("out").innerHTML = STEPS[k].join("\n");
  };
</script>
</body>
</html>
