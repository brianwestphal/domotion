<!DOCTYPE html>
<!-- Progress-install demo page. One terminal window whose `step(k)` helper
     drives the npm-install output forward one line at a time: the command
     commits, "Resolving dependencies…" appears, a textual progress bar fills
     (its cells change per step — the glyph-diffing the compressed run pairs),
     then the completion lines land. The animate config types the command as a
     `typing` overlay on frame 1, then drives `step(0..5)` as the states of ONE
     compressed run (docs/100 Primitive 1 / docs/43 §11), so the terminal chrome
     and the unchanged lines are emitted once and only the deltas animate. -->
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #0d1117; font-family: "SF Mono", Menlo, Monaco, monospace; }
  .bar { height: 36px; background: #161b22; display: flex; align-items: center; gap: 8px; padding: 0 14px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .red { background: #ff5f56; } .yellow { background: #ffbd2e; } .green { background: #27c93f; }
  .title { margin-left: 8px; font-size: 12px; color: #6e7681; }
  .body { padding: 16px; font-size: 14px; line-height: 22px; color: #c9d1d9; white-space: pre; }
  .prompt { color: #3fb950; }
  .dim { color: #8b949e; }
  .ok { color: #3fb950; }
  .track { color: #58a6ff; }
  .pct { color: #8b949e; }
</style>
</head>
<body>
  <div class="bar"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span><span class="title">zsh — ~/project</span></div>
  <div class="body" id="out"><span class="prompt">$</span> </div>
<script>
  var CMD = '<span class="prompt">$</span> npm install domotion-svg';
  var CELLS = 20;
  function bar(pct) {
    var n = Math.round((pct / 100) * CELLS);
    var filled = "";
    for (var i = 0; i < CELLS; i++) filled += (i < n ? "█" : "░");
    return '<span class="track">[' + filled + ']</span> <span class="pct">' + String(pct).padStart(3, " ") + '%</span>';
  }
  var PCTS = [0, 0, 18, 54, 100];
  // Keep the line STRUCTURE stable once the output area is up (command, blank,
  // status line, progress/result line): later steps swap CONTENT in place rather
  // than inserting rows, so the compressor never has to guess a cross-line move.
  window.step = function (k) {
    var lines = [CMD];
    if (k >= 1) {
      lines.push("");
      lines.push(k >= 5 ? '<span class="ok">added 24 packages</span> <span class="dim">in 3s</span>'
                        : '<span class="dim">Resolving dependencies…</span>');
    }
    if (k >= 2) {
      lines.push(k >= 5 ? '<span class="ok">✓ ready to render</span>' : bar(PCTS[k]));
    }
    document.getElementById("out").innerHTML = lines.join("\n");
  };
</script>
</body>
</html>
