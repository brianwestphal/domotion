<!doctype html>
<html>
<head><meta charset="utf-8"><style>
  html, body { margin: 0; }
  main {
    width: 560px;
    padding: 32px;
    background: #0d1117;
    color: #e6edf3;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }
  .row { margin: 0 0 10px; font-size: 22px; }
  .w300 { font-weight: 300; }
  .w400 { font-weight: 400; }
  .w600 { font-weight: 600; }
  .w700 { font-weight: 700; }
  .it { font-style: italic; }
  .accent { color: #d29922; }
</style></head>
<body>
  <main>
    <p class="row w300">Light 300 — the quick brown fox</p>
    <p class="row w400">Regular 400 — the quick brown fox</p>
    <p class="row w600 accent">Semibold 600 — the quick brown fox</p>
    <p class="row w700">Bold 700 — <span class="it">and bold italic</span></p>
    <p class="row w400 it">Italic 400 — jumps over the lazy dog</p>
  </main>
</body>
</html>
