name: Paths/native raster floor evidence

on:
  workflow_dispatch:
  push:
    branches:
      - validation/dm2353-arm64

jobs:
  produce:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        evidence: [proposal, validation]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned source-owned font corpus
        uses: actions/checkout@v4
        with:
          repository: harfbuzz/harfbuzz
          ref: 4de187dd0a915d13c976fa8bd474c084229f3aab
          path: .native-raster-fonts
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            test/api/fonts/OpenSans-Regular.ttf
            test/api/fonts/SourceSansPro-Regular.abc.otf
            test/api/fonts/AdobeVFPrototype.abc.static.otf
            test/api/fonts/Roboto-Variable.abc.ttf
            test/api/fonts/TestCFF2VF.otf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build DirectWrite identity helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/win32-glyph-extractor/build.ps1
      - name: Install pinned Chromium with Linux system dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install pinned Chromium
        if: runner.os != 'Linux'
        run: npx playwright install chromium
      - name: Collect native and paths observations
        shell: bash
        run: >-
          npm run fonts:paths-raster:collect --
          --font-root .native-raster-fonts/test/api/fonts
          --out observations/observations.json
          --artifact-dir observations
          --run-label ${{ matrix.evidence }}
      - name: Reauthenticate PNGs and recompute residuals
        shell: bash
        run: >-
          npm run fonts:paths-raster:produce --
          --observations observations/observations.json
          --out observations/paths-native-raster-rows.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paths-native-raster-${{ runner.os }}-${{ matrix.evidence }}
          path: |
            observations/paths-native-raster-rows.json
            observations/*-native.png
            observations/*-paths.png
          if-no-files-found: error
          compression-level: 0

  adjudicate:
    needs: produce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: paths-native-raster-*
          path: artifacts
      - name: Logical-first strict adjudication
        run: >-
          npm run fonts:paths-raster:aggregate --
          --artifacts artifacts
          --envelopes tools/paths-native-raster-envelopes.json
          --out paths-native-raster-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paths-native-raster-report
          path: paths-native-raster-report.json
          if-no-files-found: error
