name: Transformed text parity

# Each native runner independently compares source Chromium with the capture
# protocol and complete generated SVG. Reports contain browser/OS/font/source
# fingerprints. The line-origin and FragmentItem UTF-16 span legs are structured
# logical comparisons against pinned Blink/HarfBuzz source semantics: they have
# no screenshot baseline or tolerance envelope.
on:
  pull_request:
    paths:
      - "src/capture/text-paint-geometry-cdp.ts"
      - "src/capture/text-fragment-geometry.ts"
      - "src/capture/text-fragment-spans.ts"
      - "src/capture/text-fragment-spans.test.ts"
      - "src/capture/text-line-origin.ts"
      - "src/capture/text-line-origin.test.ts"
      - "src/capture/types.ts"
      - "src/capture/index.ts"
      - "src/capture/script/index.ts"
      - "src/capture/script/walker/text-segments.ts"
      - "src/render/text-affine.ts"
      - "src/render/text.ts"
      - "src/render/element-tree-to-svg.ts"
      - "tools/text-transform-geometry-audit.ts"
      - "tools/text-affine-baseline-protocol-oracle.ts"
      - "tools/text-fragment-span-oracle.ts"
      - "tests/text-affine-baseline-protocol-oracle.test.ts"
      - "tests/text-affine-line-origin-workflow.test.ts"
      - "tests/text-fragment-span-oracle.test.ts"
      - "tests/text-fragment-span-workflow.test.ts"
      - "tests/text-transform-parity-gate.test.ts"
      - "tests/text-paint-geometry.e2e.test.ts"
      - "tests/text-affine-render.e2e.test.ts"
      - "docs/215-affine-text-baseline-protocol.md"
      - "tools/parity-program.json"
      - "tools/semantic-coverage.json"
      - "package.json"
      - ".github/workflows/text-transform-parity.yml"
  push:
    branches: [main]
    paths:
      - "src/capture/text-paint-geometry-cdp.ts"
      - "src/capture/text-fragment-geometry.ts"
      - "src/capture/text-fragment-spans.ts"
      - "src/capture/text-fragment-spans.test.ts"
      - "src/capture/text-line-origin.ts"
      - "src/capture/text-line-origin.test.ts"
      - "src/capture/types.ts"
      - "src/capture/index.ts"
      - "src/capture/script/index.ts"
      - "src/capture/script/walker/text-segments.ts"
      - "src/render/text-affine.ts"
      - "src/render/text.ts"
      - "src/render/element-tree-to-svg.ts"
      - "tools/text-transform-geometry-audit.ts"
      - "tools/text-affine-baseline-protocol-oracle.ts"
      - "tools/text-fragment-span-oracle.ts"
      - "tests/text-affine-baseline-protocol-oracle.test.ts"
      - "tests/text-affine-line-origin-workflow.test.ts"
      - "tests/text-fragment-span-oracle.test.ts"
      - "tests/text-fragment-span-workflow.test.ts"
      - "tests/text-transform-parity-gate.test.ts"
      - "tests/text-paint-geometry.e2e.test.ts"
      - "tests/text-affine-render.e2e.test.ts"
      - "docs/215-affine-text-baseline-protocol.md"
      - "tools/parity-program.json"
      - "tools/semantic-coverage.json"
      - "package.json"
      - ".github/workflows/text-transform-parity.yml"
  workflow_dispatch:

env:
  NODE_VERSION: "22.21.0"

jobs:
  parity:
    name: ${{ matrix.label }} transformed text
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
          - os: ubuntu-latest
            label: Linux
          - os: windows-latest
            label: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Validate hard-gate corpus and tolerances
        run: npx vitest run tests/text-transform-parity-gate.test.ts
      - name: Prove pinned-source line-origin semantics
        run: npm run transform:text-baseline-protocol -- --json tests/output/text-affine-line-origin-${{ runner.os }}.json
      - name: Prove exact FragmentItem UTF-16 and shaped-run ownership
        run: npm run transform:text-fragment-spans -- --json tests/output/text-fragment-spans-${{ runner.os }}.json
      - name: Run exact fragment and final-ink legs
        run: npm run transform:text-parity-gate -- --dpr 1,2 --json tests/output/text-transform-parity-${{ runner.os }}.json
      - name: Upload fingerprinted report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transformed-text-${{ runner.os }}
          path: |
            tests/output/text-transform-parity-${{ runner.os }}.json
            tests/output/text-affine-line-origin-${{ runner.os }}.json
            tests/output/text-fragment-spans-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 30

  text-protocol-release-gate:
    name: Structured line-origin and FragmentItem release gate
    needs: parity
    runs-on: ubuntu-latest
    steps:
      - run: echo "Pinned-source line-origin and FragmentItem span semantics passed on macOS, Linux, and Windows."
