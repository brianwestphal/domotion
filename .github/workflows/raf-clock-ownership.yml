name: Capture rAF ownership

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/capture/animation-frame.ts"
      - "src/capture/raf-clock.ts"
      - "src/capture/replaced-media-frame.ts"
      - "tests/raf-clock.e2e.test.ts"
      - "tests/replaced-media-frame.e2e.test.ts"
      - ".github/workflows/raf-clock-ownership.yml"

jobs:
  logical:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.0
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Exact headless main/OOPIF rAF ownership
        run: npx vitest run --config vitest.e2e.config.ts tests/raf-clock.e2e.test.ts
        env:
          CI: "true"
      - name: Exact headless replaced-media frame transaction
        run: npx vitest run --config vitest.e2e.config.ts tests/replaced-media-frame.e2e.test.ts
        env:
          CI: "true"
