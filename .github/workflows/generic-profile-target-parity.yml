name: Generic profile and target parity

on:
  pull_request:
    paths:
      - "src/capture/generic-font-probe.ts"
      - "src/capture/index.ts"
      - "tools/generic-profile-target-oracle.ts"
      - "scripts/install-windows-profile-fixture-fonts.ps1"
      - "assets/fonts/fixture/DomotionProfileDevanagari*.ttf"
      - "tests/generic-profile-target-*.test.ts"
      - "docs/219-authenticated-profile-oopif-generic-preferences.md"
      - ".github/workflows/generic-profile-target-parity.yml"
  workflow_dispatch:

jobs:
  logical-profile-target:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.0
          cache: npm
      - name: Install deterministic Windows Devanagari comparison families
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install-windows-profile-fixture-fonts.ps1
      - run: npm ci
      - name: Exact profile and target authority
        if: runner.os != 'Linux'
        run: npm run fonts:generic-profile-target -- --allow-headed-browser --json generic-profile-target.json
      - name: Exact profile and target authority under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run fonts:generic-profile-target -- --allow-headed-browser --json generic-profile-target.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generic-profile-target-${{ runner.os }}
          path: generic-profile-target.json
