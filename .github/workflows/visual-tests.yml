name: Visual tests (sharded)

# DM-1662: encode suite + os in the run title so the review tool can find the
# latest completed run for a given suite via `gh run list --json displayTitle`.
run-name: Visual tests · ${{ inputs.suite }} · os=${{ inputs.os }}${{ inputs.only != '' && format(' · only={0}', inputs.only) || '' }}

# DM-1216: fan the html-test / html-test-unicode visual-regression suites out
# across many free public-repo runners so an ~1h throttled local run becomes a
# few-minute CI run off the interactive machine. Each shard is one matrix job
# running a STRIDE of the fixtures (HTML_TEST_SHARD=i/N — see tests/shard.ts);
# the aggregate job merges the per-shard results.json and writes a Step Summary.
#
# Manual dispatch only. Default OS is macOS (the calibration target). Linux runs
# in the pinned Playwright container so the calibrated FreeType/Liberation font
# set is used; it is EXPECTED to differ from macOS (separate calibration + the
# runner's Linux coverage floor) — use it for tofu/missing-font regressions, not
# pixel-matching. windows-latest is Windows Server (narrower default fonts) — for
# Windows-specific debugging. See docs/66-ci-visual-tests.md.

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Runner OS'
        type: choice
        options: [macos, linux, windows, all]
        default: macos
      suite:
        description: 'Which suite to run'
        type: choice
        options: [unicode, html]
        default: unicode
      shards:
        description: 'Shards per OS ("auto" = per-OS concurrency caps: macOS 5 / Linux 16 / Windows 5)'
        default: auto
      only:
        description: 'Optional fixture name filter (passed to --only)'
        default: ''
      update_baseline:
        description: 'Write this run as the committed CI baseline artifact (review + commit it locally)'
        type: boolean
        default: false
      keep_passing:
        description: 'Keep PASSING fixtures'' expected/actual/diff artifacts too (default: keep everything for review; set false to prune passing and shrink artifacts)'
        type: boolean
        default: true
      include_svg:
        description: 'Include the generated .svg files in artifacts (default false — they are ~85% of the weight and the review UI only needs the PNGs)'
        type: boolean
        default: false
      dpr:
        description: 'Capture device pixel ratio (default 1). dpr=2 renders expected+actual at 2× — a diagnostic for glyph-sheet-audit so ink clears the DM-1686 comparator''s ≥32px regime.'
        default: '1'
      hinted_subset:
        description: 'DOMOTION_HINTED_SUBSET override. Empty/1 = default hb-subset embedded path; 0 = svg2ttf control.'
        default: ''
      fallback_base:
        description: 'DOMOTION_FALLBACK_BASE override (DM-1852). Empty = renderer default (ON — ask CoreText from the run''s own primary); 0 = force the old hardcoded Helvetica cascade base for A/B. Both arms of the A/B run from ONE ref so the only difference is the flag.'
        default: ''
      live_fallback_first:
        description: 'DOMOTION_LIVE_FALLBACK_FIRST override (DM-1868). Empty = renderer default (ON — Blink''s kSystemFonts order, OS first and the static chain only as the net); 0 = force the old static-chain-first order for A/B.'
        default: ''
      system_ui_base:
        description: 'DOMOTION_SYSTEM_UI_BASE override (DM-1859). Empty = renderer default (ON — a system-ui run''s cascade is walked from the CoreText UI font, the way MatchSystemUIFont builds it); 0 = force the old non-UI base for A/B. Only meaningful together with live_fallback_first ON, since the static chain otherwise answers first.'
        default: ''
      trak_hb_shaping:
        description: 'DOMOTION_TRAK_HB_SHAPING override (DM-1916). Empty = renderer default (ON — a trak+STAT face is shaped by HarfBuzz at the run''s point size, with outlines still from the platform helper); 0 = force the platform shaper for A/B. Both arms run from ONE ref so the flag is the only difference.'
        default: ''

env:
  # Match the Release/Windows workflows' pin (Node 22.22.x ships a broken npm).
  NODE_VERSION: '22.21.0'
  # Keep in sync with the installed @playwright/test version (test-linux.yml too).
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.59.1-noble

concurrency:
  group: visual-tests-${{ github.ref_name }}-${{ inputs.os }}-${{ inputs.suite }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      macos_on: ${{ steps.m.outputs.macos_on }}
      macos_total: ${{ steps.m.outputs.macos_total }}
      macos_matrix: ${{ steps.m.outputs.macos_matrix }}
      linux_on: ${{ steps.m.outputs.linux_on }}
      linux_total: ${{ steps.m.outputs.linux_total }}
      linux_matrix: ${{ steps.m.outputs.linux_matrix }}
      windows_on: ${{ steps.m.outputs.windows_on }}
      windows_total: ${{ steps.m.outputs.windows_total }}
      windows_matrix: ${{ steps.m.outputs.windows_matrix }}
    steps:
      - id: m
        shell: bash
        env:
          OS_INPUT: ${{ inputs.os }}
          SHARDS_INPUT: ${{ inputs.shards }}
        run: |
          node <<'EOF'
          const fs = require("node:fs");
          const osInput = process.env.OS_INPUT;
          const shardsInput = (process.env.SHARDS_INPUT || "auto").trim();
          const AUTO = { macos: 5, linux: 16, windows: 5 };
          const out = [];
          for (const os of ["macos", "linux", "windows"]) {
            const on = osInput === os || osInput === "all";
            const total = !on ? 0
              : shardsInput === "auto" ? AUTO[os]
              : Math.max(1, parseInt(shardsInput, 10) || AUTO[os]);
            const shards = Array.from({ length: total }, (_, i) => i + 1);
            out.push(`${os}_on=${on}`);
            out.push(`${os}_total=${total}`);
            out.push(`${os}_matrix=${JSON.stringify({ shard: shards.length ? shards : [0] })}`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, out.join("\n") + "\n");
          console.log(out.join("\n"));
          EOF

  test-macos:
    needs: setup
    if: needs.setup.outputs.macos_on == 'true'
    runs-on: macos-latest
    # Unicode's CJK-extension fixtures progress normally but take ~60–65 min
    # on stock CoreText runners; retain headroom for artifact finalization.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.macos_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - name: Font env probe (diagnostic — grep FONTPROBE in this step's log)
        run: npx tsx tools/font-env-probe.mjs
      - run: npx playwright install chromium
        # Without this the sweep measures a DIFFERENT renderer than a developer
        # runs. The macOS per-codepoint fallback resolver asks CoreText through
        # this native helper; the built binary is gitignored, so a fresh CI
        # checkout has none, `helperAvailable` goes false, and resolution silently
        # drops to the STATIC fallback chain. That picks a different face than
        # CoreText does, and the whole unicode sweep fails on faces that pass
        # locally. Reproduced by disabling the helper on a Mac: 0400-04FF-cyrillic
        # goes from clean (0 regions) to major (142 regions).
        #
        # arm64 only — `build.sh` also builds x86_64 for the universal release
        # binary, which CI does not need (the runners are arm64) and which
        # doubles the build for nothing.
      - name: Build the macOS glyph helper (CoreText fallback resolver)
        run: |
          swift build -c release --arch arm64 --package-path tools/macos-glyph-extractor
          cp tools/macos-glyph-extractor/.build/arm64-apple-macosx/release/DomotionGlyphPaths \
             tools/macos-glyph-extractor/domotion-glyph-paths
          tools/macos-glyph-extractor/domotion-glyph-paths --help >/dev/null 2>&1 || true
          echo "helper built: $(file tools/macos-glyph-extractor/domotion-glyph-paths)"
        # Runs AFTER the helper build so it describes the environment the shard
        # actually renders in. Font selection is only correct if it matches what
        # Chrome does ON THIS MACHINE — which fonts happen to be installed is not
        # something we may assume, and a developer Mac with Apple's downloadable
        # SF Pro / Noto families resolves a stack quite differently from a stock
        # runner. This asks Chrome (CSS.getPlatformFontsForNode) and our resolver
        # the same per-codepoint question here, so a disagreement is NAMED in the
        # log instead of being inferred from diff pixels somewhere else.
      - name: Chrome-vs-resolver font agreement (grep FONTAGREE in this step's log)
        run: npx tsx tools/chrome-font-agreement.ts
        continue-on-error: true
      - name: Clone html-test fixtures
        run: git clone --depth 1 https://github.com/brianwestphal/html-test.git external/html-test
      - name: Inject pinned parity corpora
        run: |
          cp tests/fixtures/html-test/35-parity-blind-spots.html external/html-test/
          cp tests/fixtures/html-test/36-composed-metamorphic-parity.html external/html-test/
      - name: Record runner image before diagnostics and rendering
        shell: bash
        run: |
          mkdir -p tests/output/${{ inputs.suite == 'unicode' && 'html-test-unicode' || 'html-test' }}
          node scripts/record-runner-image.mjs tests/output/${{ inputs.suite == 'unicode' && 'html-test-unicode' || 'html-test' }}/runner-image.txt
      - name: Record run environment before diagnostics and rendering
        shell: bash
        run: node scripts/run-env.mjs tests/output/${{ inputs.suite == 'unicode' && 'html-test-unicode' || 'html-test' }}/run-env.json
        env:
          HTML_TEST_CORPUS_IDENTITY: parity-corpus-v2:b7dbd02956ea90258b9dfa294403bdd9bc52ca1c3a3cb5187301fe9166243b67
      - name: Verify raster fallback pixel content
        if: matrix.shard == 1
        continue-on-error: true
        run: npx vitest run --config vitest.e2e.config.ts tests/raster-fallback-content.e2e.test.ts tests/native-control-source-frame.e2e.test.ts tests/effective-appearance.e2e.test.ts tests/native-control-decoration.e2e.test.ts tests/conic-chromium-raster.e2e.test.ts src/capture/backdrop-isolation.e2e.test.ts
      - name: Run shard ${{ matrix.shard }}/${{ needs.setup.outputs.macos_total }}
        shell: bash
        env:
          HTML_TEST_SHARD: ${{ matrix.shard }}/${{ needs.setup.outputs.macos_total }}
          DOMOTION_NO_NICE: '1'
          ONLY: ${{ inputs.only }}
          CAPTURE_DPR: ${{ inputs.dpr }}
          DOMOTION_HINTED_SUBSET: ${{ inputs.hinted_subset }}
          DOMOTION_FALLBACK_BASE: ${{ inputs.fallback_base }}
          DOMOTION_LIVE_FALLBACK_FIRST: ${{ inputs.live_fallback_first }}
          DOMOTION_SYSTEM_UI_BASE: ${{ inputs.system_ui_base }}
          DOMOTION_TRAK_HB_SHAPING: ${{ inputs.trak_hb_shaping }}
        run: bash scripts/ci-run-shard.sh ${{ inputs.suite }}
      - name: Collect logical-stage evidence
        if: ${{ always() && matrix.shard == 1 }}
        run: npm run stage:evidence:collect -- --out tests/output/${{ inputs.suite == 'unicode' && 'html-test-unicode' || 'html-test' }}/stage-reports
      - name: Attach logical-stage evidence manifest
        if: ${{ always() && matrix.shard == 1 }}
        run: npm run stage:evidence:build -- --reports tests/output/${{ inputs.suite == 'unicode' && 'html-test-unicode' || 'html-test' }}/stage-reports --env tests/output/${{ inputs.suite == 'unicode' && 'html-test-unicode' || 'html-test' }}/run-env.json --out tests/output/${{ inputs.suite == 'unicode' && 'html-test-unicode' || 'html-test' }}/stage-evidence.json
      - name: Attach specialized-path activation evidence
        if: always()
        run: npm run check:activation-coverage -- --json tests/output/${{ inputs.suite == 'unicode' && 'html-test-unicode' || 'html-test' }}/activation-evidence.json
      - name: Drop SVGs from artifacts (lean, review needs only PNGs)
        if: ${{ always() && inputs.include_svg != true }}
        shell: bash
        run: node scripts/drop-svgs.mjs tests/output/${{ inputs.suite == 'unicode' && 'html-test-unicode' || 'html-test' }}
      - name: Prune passing artifacts
        if: ${{ always() && inputs.keep_passing != true }}
        run: node scripts/prune-passing-artifacts.mjs tests/output/${{ inputs.suite == 'unicode' && 'html-test-unicode' || 'html-test' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-macos-shard${{ matrix.shard }}
          path: tests/output/${{ inputs.suite == 'unicode' && 'html-test-unicode' || 'html-test' }}/
          if-no-files-found: warn

  test-linux:
    needs: setup
    if: needs.setup.outputs.linux_on == 'true'
    runs-on: ubuntu-latest
    # Keep parity with macOS: a slow native-font shard must still reach the
    # always-run evidence and artifact steps instead of being killed mid-file.
    timeout-minutes: 90
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.linux_matrix) }}
    steps:
      - uses: actions/checkout@v4
      # DM-1972: Linux DOES need the helper now. This job used to skip the build
      # deliberately, on the rule that the Linux resolver just shells out to
      # fontconfig — true when the only live mechanism was the `fcfallback`
      # per-codepoint query, but not since the declared-family matcher
      # (`SkFontConfigInterfaceDirect::matchFamilyName`, Skia rev fd139e79) was
      # transcribed into the helper's `familyMatch` query.
      # `resolveLinuxFamilyMatch` returns null without a helper that knows the
      # query, and the caller degrades to the old two-slot key/key-bold table —
      # so a sweep run without this step measures a different renderer, exactly
      # as the macOS and Windows jobs below have long guarded against.
      #
      # Note the published release asset is NOT sufficient: it predates the
      # query, so an acquired binary answers "unknown query type" and degrades
      # identically. Measured in this image: `isGlyphHelperAvailable()` true,
      # `familyMatch` null.
      - name: Install helper build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake pkg-config libfreetype-dev libfontconfig-dev
      # The base Playwright image has only TrueType-outline system faces. The
      # explicit hb-subset diagnostic arm also installs STIX's OpenType/CFF
      # faces so Unicode math fixtures exercise CFF subsetting and Chromium's
      # OTS/webfont consumer. Ordinary baseline runs retain their pinned font
      # inventory because adding STIX changes fallback selection.
      - name: Install CFF validation face
        if: inputs.hinted_subset == '1'
        run: apt-get install -y --no-install-recommends fonts-stix
      - run: npm ci
      - name: Build the Linux glyph helper (fontconfig declared-family matcher)
        run: bash tools/linux-glyph-extractor/build.sh
      - name: Clone html-test fixtures
        run: git clone --depth 1 https://github.com/brianwestphal/html-test.git external/html-test
      - name: Inject pinned parity corpora
        run: |
          cp tests/fixtures/html-test/35-parity-blind-spots.html external/html-test/
          cp tests/fixtures/html-test/36-composed-metamorphic-parity.html external/html-test/
      - name: Add deterministic CFF Unicode fixture
        if: inputs.hinted_subset == '1'
        run: |
          cp tests/fixtures/html-test-unicode/cff-stix-math.html external/html-test/unicode/
          cp tests/fixtures/html-test/corner-shape-superellipses.html external/html-test/
      - name: Record runner image before diagnostics and rendering
        shell: bash
        run: |
          mkdir -p tests/output/${{ inputs.suite == 'unicode' && 'html-test-unicode' || 'html-test' }}
          node scripts/record-runner-image.mjs tests/output/${{ inputs.suite == 'unicode' && 'html-test-unicode' || 'html-test' }}/runner-image.txt
      - name: Record run environment before diagnostics and rendering
        shell: bash
        run: node scripts/run-env.mjs tests/output/${{ inputs.suite == 'unicode' && 'html-test-unicode' || 'html-test' }}/run-env.json
        env:
          HTML_TEST_CORPUS_IDENTITY: parity-corpus-v2:b7dbd02956ea90258b9dfa294403bdd9bc52ca1c3a3cb5187301fe9166243b67
      - name: Verify raster fallback pixel content
        if: matrix.shard == 1
        continue-on-error: true
        run: npx vitest run --config vitest.e2e.config.ts tests/raster-fallback-content.e2e.test.ts tests/native-control-source-frame.e2e.test.ts tests/effective-appearance.e2e.test.ts tests/native-control-decoration.e2e.test.ts tests/conic-chromium-raster.e2e.test.ts src/capture/backdrop-isolation.e2e.test.ts
      - name: Run shard ${{ matrix.shard }}/${{ needs.setup.outputs.linux_total }}
        shell: bash
        env:
          HTML_TEST_SHARD: ${{ matrix.shard }}/${{ needs.setup.outputs.linux_total }}
          DOMOTION_NO_NICE: '1'
          ONLY: ${{ inputs.only }}
          CAPTURE_DPR: ${{ inputs.dpr }}
          DOMOTION_HINTED_SUBSET: ${{ inputs.hinted_subset }}
          DOMOTION_FALLBACK_BASE: ${{ inputs.fallback_base }}
          DOMOTION_LIVE_FALLBACK_FIRST: ${{ inputs.live_fallback_first }}
          DOMOTION_SYSTEM_UI_BASE: ${{ inputs.system_ui_base }}
          DOMOTION_TRAK_HB_SHAPING: ${{ inputs.trak_hb_shaping }}
        run: bash scripts/ci-run-shard.sh ${{ inputs.suite }}
      - name: Collect logical-stage evidence
        if: ${{ always() && matrix.shard == 1 }}
        run: npm run stage:evidence:collect -- --out tests/output/${{ inputs.suite == 'unicode' && 'html-test-unicode' || 'html-test' }}/stage-reports
      - name: Attach logical-stage evidence manifest
        if: ${{ always() && matrix.shard == 1 }}
        run: npm run stage:evidence:build -- --reports tests/output/${{ inputs.suite == 'unicode' && 'html-test-unicode' || 'html-test' }}/stage-reports --env tests/output/${{ inputs.suite == 'unicode' && 'html-test-unicode' || 'html-test' }}/run-env.json --out tests/output/${{ inputs.suite == 'unicode' && 'html-test-unicode' || 'html-test' }}/stage-evidence.json
      - name: Attach specialized-path activation evidence
        if: always()
        run: npm run check:activation-coverage -- --json tests/output/${{ inputs.suite == 'unicode' && 'html-test-unicode' || 'html-test' }}/activation-evidence.json
      - name: Drop SVGs from artifacts (lean, review needs only PNGs)
        if: ${{ always() && inputs.include_svg != true }}
        shell: bash
        run: node scripts/drop-svgs.mjs tests/output/${{ inputs.suite == 'unicode' && 'html-test-unicode' || 'html-test' }}
      - name: Prune passing artifacts
        if: ${{ always() && inputs.keep_passing != true }}
        run: node scripts/prune-passing-artifacts.mjs tests/output/${{ inputs.suite == 'unicode' && 'html-test-unicode' || 'html-test' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-linux-shard${{ matrix.shard }}
          path: tests/output/${{ inputs.suite == 'unicode' && 'html-test-unicode' || 'html-test' }}/
          if-no-files-found: warn

  test-windows:
    needs: setup
    if: needs.setup.outputs.windows_on == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.windows_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npx playwright install chromium
        # Same reason as the macOS job above: the win32 per-codepoint resolver
        # asks DirectWrite through this helper, the binary is gitignored, and
        # without it font selection drops to the static chain — a different
        # renderer, not a noisier one. (Linux needs no equivalent step: its
        # resolver shells out to fontconfig rather than to a built helper.)
      - name: Build the DirectWrite glyph helper (fallback resolver)
        shell: pwsh
        run: ./tools/win32-glyph-extractor/build.ps1
      - name: Clone html-test fixtures
        run: git clone --depth 1 https://github.com/brianwestphal/html-test.git external/html-test
      - name: Inject pinned parity corpora
        run: |
          cp tests/fixtures/html-test/35-parity-blind-spots.html external/html-test/
          cp tests/fixtures/html-test/36-composed-metamorphic-parity.html external/html-test/
      - name: Record runner image before diagnostics and rendering
        shell: bash
        run: |
          mkdir -p tests/output/${{ inputs.suite == 'unicode' && 'html-test-unicode' || 'html-test' }}
          node scripts/record-runner-image.mjs tests/output/${{ inputs.suite == 'unicode' && 'html-test-unicode' || 'html-test' }}/runner-image.txt
      - name: Record run environment before diagnostics and rendering
        shell: bash
        run: node scripts/run-env.mjs tests/output/${{ inputs.suite == 'unicode' && 'html-test-unicode' || 'html-test' }}/run-env.json
        env:
          HTML_TEST_CORPUS_IDENTITY: parity-corpus-v2:b7dbd02956ea90258b9dfa294403bdd9bc52ca1c3a3cb5187301fe9166243b67
      - name: Verify raster fallback pixel content
        if: matrix.shard == 1
        continue-on-error: true
        run: npx vitest run --config vitest.e2e.config.ts tests/raster-fallback-content.e2e.test.ts tests/native-control-source-frame.e2e.test.ts tests/effective-appearance.e2e.test.ts tests/native-control-decoration.e2e.test.ts tests/conic-chromium-raster.e2e.test.ts src/capture/backdrop-isolation.e2e.test.ts
      - name: Run shard ${{ matrix.shard }}/${{ needs.setup.outputs.windows_total }}
        shell: bash
        env:
          HTML_TEST_SHARD: ${{ matrix.shard }}/${{ needs.setup.outputs.windows_total }}
          DOMOTION_NO_NICE: '1'
          ONLY: ${{ inputs.only }}
          CAPTURE_DPR: ${{ inputs.dpr }}
          DOMOTION_HINTED_SUBSET: ${{ inputs.hinted_subset }}
          DOMOTION_FALLBACK_BASE: ${{ inputs.fallback_base }}
          DOMOTION_LIVE_FALLBACK_FIRST: ${{ inputs.live_fallback_first }}
          DOMOTION_SYSTEM_UI_BASE: ${{ inputs.system_ui_base }}
          DOMOTION_TRAK_HB_SHAPING: ${{ inputs.trak_hb_shaping }}
        run: bash scripts/ci-run-shard.sh ${{ inputs.suite }}
      - name: Record per-codepoint Windows font routes
        if: ${{ always() && inputs.suite == 'unicode' && matrix.shard == 1 && inputs.only != '' }}
        shell: bash
        env:
          ONLY: ${{ inputs.only }}
        run: |
          fixture=$(find external/html-test/unicode -type f -name "*${ONLY}*.html" | head -1)
          test -n "$fixture"
          npx tsx tools/unicode-font-route-trace.ts "$fixture" --out tests/output/html-test-unicode/font-route-trace.json
      - name: Collect logical-stage evidence
        if: ${{ always() && matrix.shard == 1 }}
        shell: bash
        run: npm run stage:evidence:collect -- --out tests/output/${{ inputs.suite == 'unicode' && 'html-test-unicode' || 'html-test' }}/stage-reports
      - name: Attach logical-stage evidence manifest
        if: ${{ always() && matrix.shard == 1 }}
        shell: bash
        run: npm run stage:evidence:build -- --reports tests/output/${{ inputs.suite == 'unicode' && 'html-test-unicode' || 'html-test' }}/stage-reports --env tests/output/${{ inputs.suite == 'unicode' && 'html-test-unicode' || 'html-test' }}/run-env.json --out tests/output/${{ inputs.suite == 'unicode' && 'html-test-unicode' || 'html-test' }}/stage-evidence.json
      - name: Attach specialized-path activation evidence
        if: always()
        shell: bash
        run: npm run check:activation-coverage -- --json tests/output/${{ inputs.suite == 'unicode' && 'html-test-unicode' || 'html-test' }}/activation-evidence.json
      - name: Drop SVGs from artifacts (lean, review needs only PNGs)
        if: ${{ always() && inputs.include_svg != true }}
        shell: bash
        run: node scripts/drop-svgs.mjs tests/output/${{ inputs.suite == 'unicode' && 'html-test-unicode' || 'html-test' }}
      - name: Prune passing artifacts
        if: ${{ always() && inputs.keep_passing != true }}
        run: node scripts/prune-passing-artifacts.mjs tests/output/${{ inputs.suite == 'unicode' && 'html-test-unicode' || 'html-test' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-windows-shard${{ matrix.shard }}
          path: tests/output/${{ inputs.suite == 'unicode' && 'html-test-unicode' || 'html-test' }}/
          if-no-files-found: warn

  aggregate:
    # The merge consumes setup's enabled-OS flags and matrix totals in
    # `--expect` below. GitHub exposes outputs only from jobs named in `needs`;
    # depending on the three sweep jobs transitively is not enough.
    needs: [setup, test-macos, test-linux, test-windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all shard artifacts
        uses: actions/download-artifact@v4
        with:
          path: shard-artifacts
          pattern: results-*
      # `--expect` states the matrix size so the merge can tell a complete run
      # from a partial one. Without it the aggregate merges whatever artifacts
      # happen to exist: a macOS unicode run once lost shard 5 entirely and
      # reported "no regressions" over 655 of 818 fixtures, because the missing
      # shard's failures were simply not there to count. An OS that was not
      # dispatched reports 0 and is skipped.
      - name: Merge + write Step Summary
        id: merge
        continue-on-error: true
        run: >-
          node scripts/merge-shard-results.mjs --input shard-artifacts --out shard-artifacts
          --expect macos=${{ needs.setup.outputs.macos_on == 'true' && needs.setup.outputs.macos_total || 0 }},linux=${{ needs.setup.outputs.linux_on == 'true' && needs.setup.outputs.linux_total || 0 }},windows=${{ needs.setup.outputs.windows_on == 'true' && needs.setup.outputs.windows_total || 0 }}
      - name: Diff against committed CI baseline (+ optionally rewrite it)
        if: steps.merge.outcome == 'success'
        run: >-
          node scripts/ci-baseline-aggregate.mjs
          --input shard-artifacts --suite ${{ inputs.suite }}
          --commit ${{ github.sha }}
          ${{ inputs.update_baseline && '--update-baseline' || '' }}
      # DM-1662: a SLIM, PNG-free metadata artifact the review tool fetches on
      # demand — just the scalar per-fixture summary (~1 MB vs the ~290 MB
      # visual-tests-merged, which carries the fat `regions` arrays + all diff PNGs).
      - name: Slim metadata for the review UI
        if: always()
        run: node scripts/slim-results.mjs shard-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-tests-meta
          # `run-env-<os>.json` rides along deliberately. It is the merged
          # environment record the baseline guard is built from, and this is the
          # artifact `run-ci-visual-tests.mjs` downloads by default — so without
          # it, `--update-baseline` wrote a baseline with `env: null` and
          # silently un-installed the guard it was supposed to install. A few
          # hundred bytes against a ~1 MB artifact.
          path: |
            shard-artifacts/results-*.slim.json
            shard-artifacts/run-env-*.json
            shard-artifacts/stage-evidence-*.json
            shard-artifacts/shard-completeness-*.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-tests-merged
          path: |
            shard-artifacts/results-*.json
            shard-artifacts/baseline-*.json
            shard-artifacts/**/*-diff.png
          if-no-files-found: warn
      # DM-1741: push each OS's full image set (expected/actual/diff PNGs +
      # slim results + provenance meta) to the disposable public
      # `domotion-ci-images` repo — one single-commit orphan branch per
      # `<suite>-<os>`, force-pushed, latest-run-only. The local review tool
      # fetches INDIVIDUAL files from raw.githubusercontent.com (CDN, per-file)
      # instead of downloading whole multi-hundred-MB shard artifacts.
      # Gated on a full run: partial `--only` debug dispatches never push, so
      # the branches always hold a complete sweep.
      - name: Push images to domotion-ci-images
        if: ${{ inputs.only == '' && steps.merge.outcome == 'success' }}
        env:
          CI_IMAGES_DEPLOY_KEY: ${{ secrets.CI_IMAGES_DEPLOY_KEY }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_SHA: ${{ github.sha }}
          SUITE: ${{ inputs.suite }}
          INCLUDE_SVG: ${{ inputs.include_svg }}
        run: |
          if [ -z "$CI_IMAGES_DEPLOY_KEY" ]; then
            echo "CI_IMAGES_DEPLOY_KEY secret not set — skipping image push"; exit 0
          fi
          mkdir -p ~/.ssh
          printf %s "$CI_IMAGES_DEPLOY_KEY" > ~/.ssh/ci_images_key
          printf "\n" >> ~/.ssh/ci_images_key
          chmod 600 ~/.ssh/ci_images_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/ci_images_key -o IdentitiesOnly=yes"
          for os in macos linux windows; do
            slim="shard-artifacts/results-$os.slim.json"
            [ -f "$slim" ] || continue
            stage=$(mktemp -d)
            # Every shard dir for this OS contributes its PNGs (flat layout —
            # fixture filenames are unique per suite). SVGs ride along only when
            # the run asked for them: they are ~85% of the weight, so the default
            # branch stays lean, but `include_svg` was previously unable to reach
            # the review UI at all — the SVGs survived into the shard artifacts
            # and were then dropped here by a hard `*.png` filter, which is
            # exactly the evidence a runner-only rendering failure needs.
            find shard-artifacts -type d -name "results-$os-shard*" | while read -r d; do
              find "$d" -name "*.png" -exec cp {} "$stage/" ";"
              if [ "$INCLUDE_SVG" = "true" ]; then
                find "$d" -name "*.svg" -exec cp {} "$stage/" ";"
              fi
            done
            cp "$slim" "$stage/results.json"
            [ ! -f "shard-artifacts/stage-evidence-$os.json" ] || cp "shard-artifacts/stage-evidence-$os.json" "$stage/stage-evidence.json"
            node -e "require(\"fs\").writeFileSync(process.argv[1] + \"/meta.json\", JSON.stringify({ runId: process.env.GH_RUN_ID, commit: process.env.GH_SHA, suite: process.env.SUITE, os: process.argv[2], pushedAt: new Date().toISOString() }))" "$stage" "$os"
            branch="$SUITE-$os"
            git -C "$stage" init -q -b "$branch"
            git -C "$stage" -c user.name="domotion-ci" -c user.email="ci@invalid" add -A
            git -C "$stage" -c user.name="domotion-ci" -c user.email="ci@invalid" commit -qm "run $GH_RUN_ID @ $GH_SHA"
            git -C "$stage" push -q --force git@github.com:brianwestphal/domotion-ci-images.git "HEAD:refs/heads/$branch"
            echo "pushed $(find "$stage" -name "*.png" | wc -l) PNGs to $branch"
            rm -rf "$stage"
          done
      - name: Fail after preserving incomplete-run evidence
        if: steps.merge.outcome != 'success'
        run: |
          echo "Visual shard merge was incomplete; review artifacts were preserved above."
          exit 1
