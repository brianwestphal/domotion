name: CI

# Fast, host-independent validation on every PR and push to main: type-check,
# unit tests, and a production build. These gates previously ran ONLY in
# release.yml (which triggers on version tags), so a type error or unit-test
# regression stayed invisible until release time — exactly how DM-1220 (a
# stale `AnimationFrame.transition` test fixture missing the required
# `duration`) reached `main` red without anyone noticing. Running them here
# catches that drift on the PR that introduces it.
#
# The Linux/Windows VISUAL-fidelity suites stay in their own path-filtered
# workflows (test-linux.yml / windows-fidelity.yml) — they need the calibrated
# container / a real platform font stack. This workflow is just the
# platform-independent compile + unit signal, so it runs unconditionally.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  NODE_VERSION: '22.21.0'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run docs:index:check
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm test
      # DM-1459: behavior/feature coverage — flags a documented behavior with no
      # asserting test, or a new export/verb not yet in tests/feature-coverage.ts,
      # even at 100% line coverage. (Also enforced inside `npm test` via
      # tests/conventions.test.ts; this step surfaces the standalone report.)
      - run: npm run check:features
      - run: npm run check:parity-program
      - run: npm run check:semantic-coverage
      - run: npm run check:activation-coverage
      - run: npm run gate:parity-release -- --report-only
      - run: npm run paint:geometry-oracle
      - run: npx playwright install chromium
      - run: npm run fonts:layout:oracle
      - run: npm run paint:geometry-browser-oracle
      - run: npm run transform:geometry-oracle
      - run: npm run paint:order-oracle
      - run: npm run replaced:geometry-oracle
      - run: npm run raster:boundary-oracle

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run build

  # `package.json` has defined a `lint` script since the repo was extracted, and
  # until now NOTHING ran it — not this workflow, not release.yml, and not a git
  # hook (there is no .husky directory and core.hooksPath is unset). The cost was
  # measured: a hard ESLint error (an eslint-disable directive naming a rule that
  # typescript-eslint 8 removed, so the directive itself became "rule not found")
  # sat on main undetected until someone happened to run the command by hand.
  #
  # The gate is `--max-warnings 0`, not a non-zero grandfather threshold. A
  # threshold set to today's count is a ratchet that never ratchets: it permits
  # exactly the current number of warnings forever, and silently accepts a NEW
  # warning the moment an old one is fixed. Zero is only a fair bar because the
  # tree genuinely reports zero — the six pre-existing warnings were all false
  # positives of `kerfjs/no-raw-with-dynamic-arg`, which matches the identifier
  # `raw` syntactically with no binding resolution and so flagged two e2e tests'
  # own local `raw()` PNG-decode helper. Renaming that helper to `rawPixels`
  # removed them at the source, which is why no suppression comments were needed.
  #
  # There is deliberately NO separate "run --fix and diff" fixed-point job.
  # `eslint --fix` only applies fixes to problems ESLint reports, so zero
  # reported problems implies zero fixes applied — a green lint job already
  # proves the tree is a fixed point, and a second job asserting it could never
  # fail independently. Verified by hashing the exact 862-file linted set plus
  # the two side-effect targets below: byte-identical across two consecutive
  # `--fix` runs.
  #
  # One failure mode is worth recognizing on sight, because it is a REAL finding
  # rather than a flaky gate: `kerfjs/ai-assistant-configs` warns when the
  # checked-in `.cursorrules` / `.claude/skills/kerf-app/SKILL.md` drift behind
  # the installed kerfjs bundle's canonical copies. That means the vendored AI
  # docs are stale and need re-syncing (`npx eslint --fix eslint.config.js`), not
  # that lint is broken. The rule's own message names the file and both versions,
  # so the job log distinguishes the two cases without extra tooling.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run lint

  # DM-1980: the per-PR VISUAL gate for macOS.
  #
  # This workflow was ubuntu-only, and `visual-tests.yml`'s macOS job is
  # dispatch-only — so the platform held to PIXEL-EXACT parity (regionCount ===
  # 0, unlike the documented Linux/Windows hinting floors) had no automatic gate
  # at all. The only thing standing between a macOS visual regression and `main`
  # was the maintainer remembering to run an 8-second command. Linux and Windows
  # both had one; the strictest platform did not.
  #
  # Also the only place `npm run test:e2e` runs outside the Linux container, so
  # the 66 browser-driven capture/layout files now get a second platform.
  visual-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npx playwright install chromium
      # Without this the gate measures a DIFFERENT renderer than a developer
      # runs: the macOS per-codepoint fallback resolver asks CoreText through
      # this helper, the built binary is gitignored, so a fresh checkout has
      # none and resolution silently drops to the static chain. That is exactly
      # how the Linux fidelity gate spent months grading a path the mechanism
      # was not in (DM-1972). arm64 only — the runners are arm64 and `build.sh`
      # would otherwise also build x86_64 for the universal release binary.
      - name: Build the macOS glyph helper (CoreText fallback resolver)
        run: |
          swift build -c release --arch arm64 --package-path tools/macos-glyph-extractor
          cp tools/macos-glyph-extractor/.build/arm64-apple-macosx/release/DomotionGlyphPaths \
             tools/macos-glyph-extractor/domotion-glyph-paths
      - name: Run feature visual-regression suite
        # Absolute pass/fail is ADVISORY (`|| true`), exactly as on Linux: the
        # gate is the baseline diff below, which fails only on regressions vs
        # the last known-good run on this same image. Pre-existing residuals
        # (comp-input-button, border-styles-variants) therefore do not block,
        # but any NEW one does.
        run: npm run demos:test || true
      - name: Record run environment
        if: always()
        run: node scripts/run-env.mjs tests/output/run-env.json
      - name: Gate vs committed macOS baseline (regressions only)
        # No baseline is committed yet: the comparator prints a "no baseline"
        # note and exits 0, so this run is green and uploads the results below.
        # Seed `tests/baselines/features-macos.json` from that artifact — it must
        # be recorded on THIS runner, not on a developer Mac, whose font
        # inventory is an order of magnitude larger (2,635 vs ~370 faces) and
        # resolves stacks differently.
        run: >
          node scripts/diff-against-baseline.mjs
          --results tests/output/features-results.json
          --baseline tests/baselines/features-macos.json
          --env tests/output/run-env.json
          --strict --label "macos / features"
      - name: Run browser-driven e2e tests (capture/layout assertions)
        # `if: always()` for the reason DM-1977 established on Linux: a failure
        # in an earlier step must not hide this one. There, the e2e suite had
        # never once run because the step above it was permanently red, and its
        # 13 failures read as green-by-absence.
        if: always()
        run: npm run test:e2e
      - name: Upload results (seed the baseline from this)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: features-macos
          path: |
            tests/output/features-results.json
            tests/output/run-env.json
          if-no-files-found: error
