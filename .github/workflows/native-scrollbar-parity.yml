name: Native scrollbar parity

# DM-2484: this workflow is deliberately dispatch-only while DM-2482/DM-2483
# remain open. The aggregate is already strict and therefore red on the current
# capture-only implementation. Add pull_request/push triggers only after the
# three native reports adjudicate READY; never soften the gate to merge them.
on:
  workflow_dispatch:

env:
  NODE_VERSION: "22.21.0"

jobs:
  collect:
    name: ${{ matrix.label }} native scrollbar producer
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
          - os: ubuntu-latest
            label: Linux
          - os: windows-latest
            label: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Create platform evidence directory
        run: node -e "require('node:fs').mkdirSync('tests/output/native-scrollbar/${{ runner.os }}/artifacts',{recursive:true})"
      - name: Record immutable runner image identity
        run: node scripts/record-runner-image.mjs tests/output/native-scrollbar/${{ runner.os }}/runner-image.txt
      - name: Produce pinned native scrollbar rows and lossless strips
        run: >-
          npm run scrollbars:ownership-audit --
          --json tests/output/native-scrollbar/${{ runner.os }}/report.json
          --artifacts tests/output/native-scrollbar/${{ runner.os }}/artifacts
          --dpr 1,2
          --zoom 1,1.25,2
          --report-only
      - name: Upload platform-owned evidence even when the producer finds drift
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-scrollbar-${{ runner.os }}
          path: tests/output/native-scrollbar/${{ runner.os }}/
          if-no-files-found: error

  adjudicate:
    name: Strict three-platform scrollbar release gate
    if: always()
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: native-scrollbar-*
          path: tests/output/native-scrollbar
          merge-multiple: true
      - name: Reject incomplete, partial, unreviewed, or cross-platform-substituted evidence
        run: npm run scrollbars:parity-gate -- --reports tests/output/native-scrollbar
      - name: Preserve the complete adjudication input
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-scrollbar-release-evidence
          path: tests/output/native-scrollbar/
          if-no-files-found: error
