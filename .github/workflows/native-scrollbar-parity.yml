name: Native scrollbar parity

on:
  workflow_dispatch:

env:
  NODE_VERSION: "22.21.0"

jobs:
  collect:
    name: ${{ matrix.os.label }} ${{ matrix.evidence }} native scrollbar evidence
    strategy:
      fail-fast: false
      matrix:
        os:
          - runner: macos-latest
            label: macOS
          - runner: ubuntu-latest
            label: Linux
          - runner: windows-latest
            label: Windows
        evidence: [proposal, validation]
    runs-on: ${{ matrix.os.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Create role-bound evidence directory
        run: node -e "require('node:fs').mkdirSync('tests/output/native-scrollbar/${{ runner.os }}/${{ matrix.evidence }}/artifacts',{recursive:true})"
      - name: Record immutable runner image identity
        run: node scripts/record-runner-image.mjs tests/output/native-scrollbar/${{ runner.os }}/${{ matrix.evidence }}/runner-image.txt
      - name: Record native boot identity
        run: node scripts/record-boot-identity.mjs tests/output/native-scrollbar/${{ runner.os }}/${{ matrix.evidence }}/boot-id.txt
      - name: Produce role-bound exact rows and lossless artifacts
        run: >-
          npm run scrollbars:ownership-audit --
          --json tests/output/native-scrollbar/${{ runner.os }}/${{ matrix.evidence }}/report.json
          --artifacts tests/output/native-scrollbar/${{ runner.os }}/${{ matrix.evidence }}/artifacts
          --runner-image tests/output/native-scrollbar/${{ runner.os }}/${{ matrix.evidence }}/runner-image.txt
          --boot-id tests/output/native-scrollbar/${{ runner.os }}/${{ matrix.evidence }}/boot-id.txt
          --evidence-role ${{ matrix.evidence }}
          --dpr 1,2
          --zoom 1,1.25,2
      - name: Upload role evidence even when exact ownership finds drift
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-scrollbar-${{ runner.os }}-${{ matrix.evidence }}
          path: tests/output/native-scrollbar/${{ runner.os }}/${{ matrix.evidence }}/
          if-no-files-found: error

  adjudicate:
    name: Strict six-role native scrollbar release gate
    if: always()
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: native-scrollbar-*
          path: tests/output/native-scrollbar
      - name: Reject incomplete, dependent, corrupt, or observational evidence
        run: npm run scrollbars:parity-gate -- --reports tests/output/native-scrollbar
      - name: Preserve the complete six-role adjudication input
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-scrollbar-release-evidence
          path: tests/output/native-scrollbar/
          if-no-files-found: error
