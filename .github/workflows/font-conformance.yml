name: Font conformance oracle

run-name: Font conformance · os=${{ inputs.os }} · shards=${{ inputs.shards }}${{ inputs.range != '' && format(' · range={0}', inputs.range) || '' }}${{ inputs.max_stacks != '' && format(' · max-stacks={0}', inputs.max_stacks) || '' }}

# Exhaustive font-selection parity check: for every assigned Unicode codepoint
# crossed with every font stack the fixture corpus uses, ask Chrome (CDP
# `CSS.getPlatformFontsForNode`) and Domotion's `resolveFontForCodepoint` which
# face paints it, and report every disagreement. See docs/107.
#
# THREE PLATFORMS, THREE DIFFERENT QUESTIONS. Per-codepoint fallback is not one
# procedure with three font sets behind it — Blink runs different code on each
# (macOS `font_cache_mac.mm` asks CoreText with the run's own font as the base;
# Linux `font_cache_linux.cc` asks fontconfig keyed on locale with no base font;
# Windows `font_cache_skia_win.cc` consults a hardcoded per-script table before
# falling through to DirectWrite). So each platform gets its own sweep, its own
# stack corpus, and its own baseline, and a number from one says nothing about
# another.
#
# Sharded on STACKS rather than codepoints: the resolver memoizes each
# first-seen uncovered codepoint's platform-fallback lookup, so a stack shard
# pays the cold-cache cost once and every later stack in the same job is several
# times faster. A codepoint shard would re-pay it in every shard.
#
# Manual dispatch. The full cross product is ~122M comparisons PER PLATFORM —
# hours of work fanned across runners, not a per-PR gate. The DEFAULT inputs
# sweep the canonical baseline slice (the six most-used corpus stacks, full
# codepoint universe, one stack per shard), which is what the committed
# per-platform baselines record and what the gate can compare. Widen it with
# `max_stacks` / `shards` for a deeper run — and read the report's `meta` block,
# which records exactly what was swept, before quoting any number.

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Platform to sweep — each has its own corpus and baseline'
        type: choice
        options: [macos, linux, windows, all]
        default: macos
      shards:
        description: 'Number of stack shards to fan out across'
        default: '6'
      cp_shards:
        description: 'DM-1887. Codepoint shards per stack shard (2nd matrix axis). 1 = the stack-only fan-out this workflow shipped with. Total jobs = shards x cp_shards, so mind the ~20-job concurrency ceiling. Widen for LINUX first: its per-job overhead is 49s against macOS''s 156s (36% of the job), so extra macOS jobs mostly buy more npm / Playwright / Swift setup.'
        default: '1'
      max_stacks:
        description: 'Cap on the number of corpus stacks (most-used first). Use "all" for the whole corpus (hours per platform, sharded) — NOT an empty string: GitHub substitutes the default for an empty workflow_dispatch input, so a run meant to sweep everything silently swept the canonical six.'
        default: '6'
      range:
        description: 'Optional codepoint range filter, e.g. 0000-2FFF (comma-separated for several)'
        default: ''
      no_pua:
        description: 'Skip private-use codepoints (137k of 292k) for a faster run'
        type: boolean
        default: false
      strict_alias:
        description: 'Treat the documented macOS system-font naming alias as a mismatch'
        type: boolean
        default: false
      update_baseline:
        description: 'Write this run back as the platform baseline instead of gating on it (artifact only — commit it by hand)'
        type: boolean
        default: false

env:
  NODE_VERSION: '22.21.0'

concurrency:
  group: font-conformance-${{ github.ref_name }}-${{ inputs.os }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      expected: ${{ steps.m.outputs.expected }}
      os_list: ${{ steps.m.outputs.os_list }}
      macos_on: ${{ steps.m.outputs.macos_on }}
      linux_on: ${{ steps.m.outputs.linux_on }}
      windows_on: ${{ steps.m.outputs.windows_on }}
    steps:
      - id: m
        run: |
          n="${{ inputs.shards }}"
          c="${{ inputs.cp_shards }}"
          c="${c:-1}"
          list=$(seq 1 "$n" | paste -sd, -)
          cplist=$(seq 1 "$c" | paste -sd, -)
          # DM-1887: GitHub takes the cross product of matrix dimensions, so this
          # fans out to `shards x cp_shards` jobs. `total` / `cp_total` are
          # single-element dimensions carrying the denominators to the shard script.
          echo "matrix={\"shard\":[$list],\"cp\":[$cplist],\"total\":[$n],\"cp_total\":[$c]}" >> "$GITHUB_OUTPUT"
          echo "expected=$((n * c))" >> "$GITHUB_OUTPUT"
          sel="${{ inputs.os }}"
          on() { [ "$sel" = "$1" ] || [ "$sel" = "all" ] && echo true || echo false; }
          echo "macos_on=$(on macos)" >> "$GITHUB_OUTPUT"
          echo "linux_on=$(on linux)" >> "$GITHUB_OUTPUT"
          echo "windows_on=$(on windows)" >> "$GITHUB_OUTPUT"
          if [ "$sel" = "all" ]; then
            echo 'os_list=["macos","linux","windows"]' >> "$GITHUB_OUTPUT"
          else
            echo "os_list=[\"$sel\"]" >> "$GITHUB_OUTPUT"
          fi

  sweep-macos:
    needs: setup
    if: needs.setup.outputs.macos_on == 'true'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npx playwright install chromium
        # Without the native helper the macOS per-codepoint fallback resolver
        # cannot ask CoreText and silently drops to the static chain — which
        # answers a DIFFERENT question than the one this workflow reports on.
      - name: Build the macOS glyph helper (CoreText fallback resolver)
        run: |
          swift build -c release --arch arm64 --package-path tools/macos-glyph-extractor
          cp tools/macos-glyph-extractor/.build/arm64-apple-macosx/release/DomotionGlyphPaths \
             tools/macos-glyph-extractor/domotion-glyph-paths
          echo "helper built: $(file tools/macos-glyph-extractor/domotion-glyph-paths)"
      - name: Font env probe (diagnostic — grep FONTPROBE in this step's log)
        run: npx tsx tools/font-env-probe.mjs
      - name: Sweep
        run: bash scripts/ci-font-conformance-shard.sh
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ matrix.total }}
          CP_SHARD: ${{ matrix.cp }}
          CP_TOTAL: ${{ matrix.cp_total }}
          RANGE: ${{ inputs.range }}
          MAX_STACKS: ${{ inputs.max_stacks }}
          NO_PUA: ${{ inputs.no_pua }}
          STRICT_ALIAS: ${{ inputs.strict_alias }}
      - uses: actions/upload-artifact@v4
        with:
          name: font-conformance-macos-shard-${{ matrix.shard }}-cp${{ matrix.cp }}
          path: tests/output/font-conformance/
          retention-days: 14

  sweep-linux:
    needs: setup
    if: needs.setup.outputs.linux_on == 'true'
    runs-on: ubuntu-latest
    # The pinned Playwright image, not a bare ubuntu-latest: the Linux fallback
    # answer IS the container's fontconfig set (Liberation / DejaVu / Noto /
    # WenQuanYi), and a different image is a different oracle. It is also the
    # image the Linux fidelity suites already calibrate against.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
        # DM-1886 INVERTED the note that used to live here. The Linux
        # per-codepoint resolver no longer merely shells out to `fc-match`: it
        # asks the helper's `fcfallback` query, which is Chrome's actual
        # algorithm (FcFontSort over a locale-keyed pattern, walked until a
        # font's charset covers the character) rather than `FcFontMatch` with the
        # codepoint as a scoring constraint.
        #
        # Without this build the resolver still WORKS — it degrades to the
        # `fc-match` path — and that is precisely the hazard. The sweep goes
        # green, ~350x slower, having measured a DIFFERENT algorithm than the one
        # `main` runs on a developer's machine, and any baseline captured from it
        # bakes the old answers in as ground truth. Observed: a run at 14/19 jobs
        # after 117 minutes with every lagging job a Linux one.
        #
        # Same reasoning as the macOS/Windows helper builds above and the one in
        # visual-tests.yml: a gitignored build artifact that changes which
        # renderer CI measures has to be built by the job that measures.
      - name: Build the Linux glyph helper (fontconfig fallback resolver)
        run: |
          apt-get update -qq
          apt-get install -y -qq build-essential cmake libfreetype-dev libfontconfig1-dev pkg-config
          cmake -S tools/linux-glyph-extractor -B /tmp/lgx -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/lgx -j
          cp /tmp/lgx/domotion-glyph-paths tools/linux-glyph-extractor/domotion-glyph-paths
          echo "helper built: $(file tools/linux-glyph-extractor/domotion-glyph-paths)"
          test "$(tools/linux-glyph-extractor/domotion-glyph-paths --fontconfig-mode)" = '{"fontations":true,"configReady":true}'
      - name: Sweep
        run: bash scripts/ci-font-conformance-shard.sh
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ matrix.total }}
          CP_SHARD: ${{ matrix.cp }}
          CP_TOTAL: ${{ matrix.cp_total }}
          RANGE: ${{ inputs.range }}
          MAX_STACKS: ${{ inputs.max_stacks }}
          NO_PUA: ${{ inputs.no_pua }}
          STRICT_ALIAS: ${{ inputs.strict_alias }}
      - uses: actions/upload-artifact@v4
        with:
          name: font-conformance-linux-shard-${{ matrix.shard }}-cp${{ matrix.cp }}
          path: tests/output/font-conformance/
          retention-days: 14

  sweep-windows:
    needs: setup
    if: needs.setup.outputs.windows_on == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npx playwright install chromium
        # Same reasoning as macOS: without the DirectWrite helper the Windows
        # resolver cannot run either of Blink's fallback stages live and drops
        # to the static per-block table.
      - name: Build the DirectWrite glyph helper (fallback resolver)
        shell: pwsh
        run: ./tools/win32-glyph-extractor/build.ps1
      - name: Sweep
        shell: bash
        run: bash scripts/ci-font-conformance-shard.sh
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ matrix.total }}
          CP_SHARD: ${{ matrix.cp }}
          CP_TOTAL: ${{ matrix.cp_total }}
          RANGE: ${{ inputs.range }}
          MAX_STACKS: ${{ inputs.max_stacks }}
          NO_PUA: ${{ inputs.no_pua }}
          STRICT_ALIAS: ${{ inputs.strict_alias }}
      - uses: actions/upload-artifact@v4
        with:
          name: font-conformance-windows-shard-${{ matrix.shard }}-cp${{ matrix.cp }}
          path: tests/output/font-conformance/
          retention-days: 14

  aggregate:
    needs: [setup, sweep-macos, sweep-linux, sweep-windows]
    if: always() && needs.setup.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.setup.outputs.os_list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - uses: actions/download-artifact@v4
        with:
          path: shards
          pattern: 'font-conformance-${{ matrix.os }}-shard-*'
      - name: Merge shard reports
        run: |
          node scripts/merge-font-conformance-shards.mjs \
            --shards shards \
            --os ${{ matrix.os }} \
            --expected ${{ needs.setup.outputs.expected }} \
            --out merged.json
      # Baseline-relative, not absolute-zero: Linux and Windows have never been
      # measured before, so an absolute gate would fail identically on every run
      # and grade nothing. A regression against the platform's OWN last recorded
      # measurement is the signal; the absolute number is reported and tracked.
      - name: Gate vs this platform's committed baseline
        run: >
          node scripts/diff-font-conformance-baseline.mjs
          --results merged.json
          --baseline tests/baselines/font-conformance-${{ matrix.os }}.json
          --label "${{ matrix.os }} / font-conformance"
          ${{ inputs.update_baseline && '--update-baseline' || '--strict' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: font-conformance-${{ matrix.os }}-merged
          path: |
            merged.json
            tests/baselines/font-conformance-${{ matrix.os }}.json
          retention-days: 30
