name: Release helpers

# Builds the native glyph-extractor helper binaries and attaches them to an
# existing GitHub release. Domotion downloads the matching
# platform/arch asset on demand at runtime — the binaries are intentionally
# NOT committed to git and NOT bundled in the npm tarball (they live only as
# release assets).
#
# release.yml calls this reusable workflow only after creating the GitHub
# release. Every build first uploads its staged binary + checksum as a retained
# Actions artifact; one fan-in job then attaches the complete set. A transient
# attach failure can therefore be retried without repeating native builds,
# signing, or notarization.
#
# All native helper binaries are wired up here: macOS (universal,
# signed/notarized), Linux (x64 + arm64, FreeType), and Windows (x64 + arm64,
# DirectWrite). The arm64 jobs (DM-886) run on GitHub's arm64 runners and
# upload the `-linux-arm64` / `-win32-arm64.exe` assets the acquisition layer
# resolves for arm64 hosts.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag whose source is built and whose release receives the assets'
        required: true
        type: string
  # Manual re-run against an EXISTING release tag — lets you iterate on the
  # signing setup without cutting a new version (it only uploads helper assets,
  # never publishes to npm).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)attach the helper binary to, e.g. v0.3.1'
        required: true
        type: string

permissions:
  contents: write   # attach assets to the release

concurrency:
  group: release-helpers-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  macos-glyph-extractor:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.tag }}' }

      # Imports the Developer ID Application cert (+ private key) from the
      # base64-encoded .p12 secret into a throwaway keychain and authorizes
      # codesign to use it, so `build.sh`'s `codesign --sign "$APPLE_DEVELOPER_ID"`
      # resolves the identity. The keychain is created fresh per run and torn
      # down at job end by the action.
      - name: Import Developer ID Application certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERT_PASSWORD }}

      # build.sh: universal arm64 + x86_64 `swift build` + `lipo`, then
      # `codesign --options runtime --timestamp` and `xcrun notarytool submit
      # --wait`. It self-skips signing when APPLE_DEVELOPER_ID is unset; here
      # all four credentials are present so it signs + notarizes. (A bare CLI
      # Mach-O cannot be stapled — only .app/.pkg/.dmg can — so the notarization
      # ticket lives server-side; the runtime verifies with `codesign --verify`.)
      - name: Build, codesign, and notarize the universal binary
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: bash tools/macos-glyph-extractor/build.sh

      - name: Verify the signature
        working-directory: tools/macos-glyph-extractor
        run: |
          set -euo pipefail
          codesign --verify --strict --verbose=2 domotion-glyph-paths
          codesign --display --verbose=4 domotion-glyph-paths

      # Rename to the documented asset name and emit a SHA-256 sidecar so the
      # runtime download (the acquisition half of this distribution work) can
      # integrity-check before caching.
      - name: Stage release asset
        run: |
          set -euo pipefail
          cp tools/macos-glyph-extractor/domotion-glyph-paths \
             "$RUNNER_TEMP/domotion-glyph-paths-darwin-universal"
          cd "$RUNNER_TEMP"
          shasum -a 256 domotion-glyph-paths-darwin-universal \
            > domotion-glyph-paths-darwin-universal.sha256

      - name: Retain staged release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-helper-darwin-universal
          path: |
            ${{ runner.temp }}/domotion-glyph-paths-darwin-universal
            ${{ runner.temp }}/domotion-glyph-paths-darwin-universal.sha256
          if-no-files-found: error
          retention-days: 7

  linux-glyph-extractor:
    runs-on: ubuntu-22.04   # glibc 2.35 floor — see tools/linux-glyph-extractor/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.tag }}' }

      # FreeType dev headers + a C++17 toolchain. The binary links
      # libfreetype.so.6 dynamically; that shared library is always present
      # wherever Domotion runs because Chromium-on-Linux requires it
      # (libfreetype6 is part of `npx playwright install-deps`).
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libfreetype-dev

      - name: Build the helper
        run: bash tools/linux-glyph-extractor/build.sh

      # Rename to the documented asset name and emit a SHA-256 sidecar so the
      # runtime download can integrity-check before caching.
      - name: Stage release asset
        run: |
          set -euo pipefail
          strip tools/linux-glyph-extractor/domotion-glyph-paths || true
          cp tools/linux-glyph-extractor/domotion-glyph-paths \
             "$RUNNER_TEMP/domotion-glyph-paths-linux-x64"
          cd "$RUNNER_TEMP"
          sha256sum domotion-glyph-paths-linux-x64 \
            > domotion-glyph-paths-linux-x64.sha256

      - name: Retain staged release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-helper-linux-x64
          path: |
            ${{ runner.temp }}/domotion-glyph-paths-linux-x64
            ${{ runner.temp }}/domotion-glyph-paths-linux-x64.sha256
          if-no-files-found: error
          retention-days: 7

  linux-arm64-glyph-extractor:
    runs-on: ubuntu-22.04-arm   # GitHub-hosted arm64 Linux runner; glibc 2.35 floor
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.tag }}' }

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libfreetype-dev

      # build.sh compiles for the host arch, so on an arm64 runner it produces
      # the arm64 binary — no cross-compilation needed.
      - name: Build the helper
        run: bash tools/linux-glyph-extractor/build.sh

      - name: Stage release asset
        run: |
          set -euo pipefail
          strip tools/linux-glyph-extractor/domotion-glyph-paths || true
          cp tools/linux-glyph-extractor/domotion-glyph-paths \
             "$RUNNER_TEMP/domotion-glyph-paths-linux-arm64"
          cd "$RUNNER_TEMP"
          sha256sum domotion-glyph-paths-linux-arm64 \
            > domotion-glyph-paths-linux-arm64.sha256

      - name: Retain staged release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-helper-linux-arm64
          path: |
            ${{ runner.temp }}/domotion-glyph-paths-linux-arm64
            ${{ runner.temp }}/domotion-glyph-paths-linux-arm64.sha256
          if-no-files-found: error
          retention-days: 7

  windows-glyph-extractor:
    runs-on: windows-latest   # x64; DirectWrite + the Windows SDK ship preinstalled
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.tag }}' }

      # MSVC + the Windows SDK (dwrite.lib, D2D headers) are preinstalled on the
      # runner. build.ps1 drives CMake and links the CRT statically (/MT), so the
      # .exe runs on a clean Windows with no VC++ redistributable.
      - name: Build the helper
        shell: pwsh
        run: ./tools/win32-glyph-extractor/build.ps1

      # Rename to the documented asset name and emit a SHA-256 sidecar so the
      # runtime download can integrity-check before caching. (sha256sum + cp come
      # from Git-for-Windows' bundled coreutils under shell: bash.)
      - name: Stage release asset
        shell: bash
        run: |
          set -euo pipefail
          cp tools/win32-glyph-extractor/domotion-glyph-paths.exe \
             "$RUNNER_TEMP/domotion-glyph-paths-win32-x64.exe"
          cd "$RUNNER_TEMP"
          sha256sum domotion-glyph-paths-win32-x64.exe \
            > domotion-glyph-paths-win32-x64.exe.sha256

      - name: Retain staged release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-helper-win32-x64
          path: |
            ${{ runner.temp }}/domotion-glyph-paths-win32-x64.exe
            ${{ runner.temp }}/domotion-glyph-paths-win32-x64.exe.sha256
          if-no-files-found: error
          retention-days: 7

  windows-arm64-glyph-extractor:
    runs-on: windows-11-arm   # GitHub-hosted arm64 Windows runner; MSVC + SDK preinstalled
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.tag }}' }

      # build.ps1 drives CMake for the host arch; on the arm64 runner it links
      # an arm64 .exe (CRT statically linked /MT, no VC++ redistributable).
      - name: Build the helper
        shell: pwsh
        run: ./tools/win32-glyph-extractor/build.ps1

      - name: Stage release asset
        shell: bash
        run: |
          set -euo pipefail
          cp tools/win32-glyph-extractor/domotion-glyph-paths.exe \
             "$RUNNER_TEMP/domotion-glyph-paths-win32-arm64.exe"
          cd "$RUNNER_TEMP"
          sha256sum domotion-glyph-paths-win32-arm64.exe \
            > domotion-glyph-paths-win32-arm64.exe.sha256

      - name: Retain staged release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-helper-win32-arm64
          path: |
            ${{ runner.temp }}/domotion-glyph-paths-win32-arm64.exe
            ${{ runner.temp }}/domotion-glyph-paths-win32-arm64.exe.sha256
          if-no-files-found: error
          retention-days: 7

  attach-binaries:
    needs:
      - macos-glyph-extractor
      - linux-glyph-extractor
      - linux-arm64-glyph-extractor
      - windows-glyph-extractor
      - windows-arm64-glyph-extractor
    runs-on: ubuntu-latest
    steps:
      - name: Download retained helper assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-helper-*
          path: ${{ runner.temp }}/release-helpers
          merge-multiple: true
      - name: Attach complete helper set to the existing release
        env:
          ASSET_DIR: ${{ runner.temp }}/release-helpers
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null
          gh release upload "$TAG" "$ASSET_DIR"/* --clobber
