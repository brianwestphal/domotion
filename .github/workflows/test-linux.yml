name: Linux fidelity

# Captures genuine Chromium-on-Linux signal — real FreeType font fallback +
# the Liberation / FreeFont / WenQuanYi fonts the Linux fallback chain (DM-259)
# was calibrated against. Every job runs INSIDE the pinned Playwright "noble"
# container: the same image `npm run test:linux-docker` uses and DM-259
# calibrated against. A bare `ubuntu-latest` runner ships a different font set,
# so its fallback routing — and the diff against our expected paint — would not
# match the calibration.
#
# Runs on PRs that touch render-affecting paths (the renderer, capture, the
# glyph extractors, the visual fixtures/runner, or the deps that drive
# rendering) — so visual regressions are caught on the PRs that can cause them,
# with ~0 cost on docs/CI-only PRs (DM-262, path-filtered triggers). Also
# available via manual dispatch. The Linux fallback chain is calibrated and the
# feature suite passes within the documented Linux text-hinting floor (DM-259 /
# DM-262), so `regression` is green on a clean branch and red on genuine
# breakage. (Making these checks *blocking* is a branch-protection setting in
# the repo's GitHub settings, separate from this trigger.)
#
# Unit tests already run on every push via release.yml's `test` job on
# ubuntu-latest; this workflow adds the parts that need the calibrated
# container / a real Linux font stack: the VISUAL baseline and the FreeType
# helper's fontkit-parity test.
#
# Produces two downloadable artifacts:
#   - font-widths-linux  : Chromium-on-Linux painted advance widths (JSON), the
#                          input for (re)building the Linux fallback chain.
#   - linux-fidelity-diffs : expected/actual/diff PNGs from the feature suite,
#                          so you can eyeball where Linux output diverges.

on:
  workflow_dispatch:
  # DM-1405: NO `paths:` filter. This workflow's `regression` job is intended to
  # be a REQUIRED status check, and a required check that gets skipped (because a
  # PR didn't touch the filtered paths) shows as permanently "Expected — waiting"
  # and blocks the PR forever. Running on every PR keeps the required check always
  # reporting. The job is fast and the gate is baseline-relative (below), so the
  # cost is small and it can never silently go un-run.
  pull_request:

# Keep this image tag in sync with the installed @playwright/test version
# (scripts/test-linux-docker.sh derives the same tag dynamically). The image
# bundles Node + the Chromium build the suite captures with — matching CI's
# browser — so no setup-node / `playwright install` step is needed.
env:
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.59.1-noble

jobs:
  font-width-probe:
    # DM-1405: the `paths:` filter was dropped so the required `regression` gate
    # always reports on PRs. Keep this diagnostic probe (and glyph-extractor-build
    # below) OFF the every-PR path — run them on demand (workflow_dispatch) — so
    # only the gate runs on a normal PR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Probe Chromium-on-Linux painted advances
        run: node scripts/probe-platform-font-widths.mjs --out font-widths-linux.json
      - name: Show a summary in the run log
        run: node -e "const d=require('./font-widths-linux.json');console.log('platform',d.platform,'chromium',d.chromiumVersion,'measurements',d.widths.length)"
      - uses: actions/upload-artifact@v4
        with:
          name: font-widths-linux
          path: font-widths-linux.json
          if-no-files-found: error

  regression:
    # DM-1405: distinct check-run name so this can be a REQUIRED status check
    # without colliding with windows-fidelity.yml's `regression` job (GitHub
    # matches required checks by name; two checks named "regression" would let
    # the most-recent one alone satisfy the requirement).
    name: Linux fidelity regression
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - uses: actions/checkout@v4
      # DM-1972: this gate measures the HELPER-PRESENT configuration — the
      # shipped mechanism — and asserts the mechanism is actually in the loop
      # before scoring anything against it.
      #
      # It used to be `npm ci` + `npm run demos:test`, which never built the
      # helper. So every Linux fidelity number the project had been reading came
      # from a helper-ABSENT render path, while the Linux declared-family cut
      # mechanism (`SkFontConfigInterfaceDirect::matchFamilyName`, transcribed
      # into the helper's `familyMatch` query at Skia rev fd139e79) lives
      # entirely behind the helper: `resolveLinuxFamilyMatch` returns null
      # without it and the caller degrades to the old two-slot key/key-bold
      # table. The gate was green-or-red about code that was not running — the
      # same shape as the Windows resolver that shipped "default-on" while
      # answering nothing for every codepoint.
      #
      # Why only ONE arm, when both configurations ship: because the gap between
      # them was measured, not assumed, and on this corpus it is currently zero.
      # In the pinned noble image at this ref, helper-present vs
      # DOMOTION_DISABLE_HELPER=1 moved 0 of 114 fixtures — while the resolution
      # seam itself moves (arial@550 → LiberationSans-Bold vs LiberationSans).
      # The mechanism is live and the corpus simply contains nothing that
      # notices it. Running the whole suite a second time per PR to re-derive a
      # zero is cost without signal; the `assert-linux-helper-in-loop` step
      # below is what proves the mechanism is live, and it is cheap.
      #
      # That zero is itself the finding, and it is NOT permanent: at the base ref
      # `7d905b4` the same within-run A/B moved one fixture
      # (`text-font-stretch-underline`, 0.703% pass → 1.989% fail — matching the
      # CI number exactly). A fixture that discriminates the two paths is
      # tracked as follow-up work; when one exists, this gate starts grading the
      # helper rather than merely running it.
      - name: Install helper build dependencies
        # Container runs as root (no sudo). The helper links FreeType and
        # fontconfig both; a bare `cmake` install fails at `find_package`.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake pkg-config libfreetype-dev libfontconfig-dev
      - run: npm ci
      - name: Build the Linux glyph helper (fontconfig declared-family matcher)
        run: bash tools/linux-glyph-extractor/build.sh
      - name: Assert the helper is actually in the loop
        # A built binary is not a reached one. This is the disable-and-require-
        # movement check whose absence let the Windows resolver ship inert for
        # weeks: CSS weight 550 is the rung that discriminates, because the
        # degraded two-slot table crosses to bold at 600 while fontconfig's
        # weight scoring already prefers Bold at 550. A probe at 400 or 700
        # would show no movement and prove nothing.
        run: npx tsx tools/assert-linux-helper-in-loop.ts
      - name: Run feature visual-regression suite (Linux container, helper present)
        # Passes within the Linux text-hinting floor (DM-259 / DM-262): the
        # runner applies a per-platform coverage cap on Linux because FreeType
        # grid-fits native text while Domotion fills unhinted vector outlines.
        # DM-1405: the suite's absolute pass/fail is ADVISORY here (|| true) —
        # the actual gate is the baseline diff in the next step, which fails only
        # on regressions vs tests/baselines/features-linux.json. So pre-existing
        # platform residuals (e.g. background-clip-text-nested-child-wraps DM-1420,
        # mathml-mi-greek-italic) don't block, but any NEW regression does.
        run: npm run demos:test || true
      - name: Record run environment
        # DM-1972: the fingerprint the comparator uses to say "this run was
        # measured in a DIFFERENT environment than the baseline" BEFORE any
        # count is read. Without it the report can only note that the baseline
        # predates environment recording, and an image rotation reads as a code
        # change — which has cost five wrong attributions on a single fixture.
        # Uploaded too, so the next re-seed can carry it into the baseline
        # (`scripts/seed-feature-baseline.mjs --env`).
        if: always()
        run: node scripts/run-env.mjs tests/output/run-env.json
      - name: Gate vs committed Linux baseline (regressions only, DM-1405)
        run: >
          node scripts/diff-against-baseline.mjs
          --results tests/output/features-results.json
          --baseline tests/baselines/features-linux.json
          --env tests/output/run-env.json
          --strict --label "linux / features"
      - name: Run browser-driven e2e tests (capture/layout assertions)
        # DM-1977: `if: always()` so a failure in an EARLIER step cannot hide
        # this one. It did, for as long as this suite has existed: the baseline
        # gate above was failing on a stale 104-fixture baseline, a failed step
        # ends the job, and so `npm run test:e2e` had never once run here. When
        # it finally did it reported 13 failures across 9 files — none of them
        # new, all of them invisible until that moment.
        #
        # A skipped step reads as green-by-absence in the run summary, which is
        # the same failure mode as a gate that reports a plausible number for
        # code that is not running. Running unconditionally makes the job
        # noisier while those are worked through, and that is the intended
        # trade: the alternative is not knowing.
        if: always()
        # The `*.e2e.test.ts` suite (DM-1075) launches Chromium and asserts
        # capture/render behavior directly (segment positions, external SVG
        # refs) rather than via the perceptual visual diff — which is too
        # lenient to gate fine-grained layout bugs (e.g. DM-1105's mis-anchored
        # ::before gutter marker). The container ships a browser, so these run
        # here alongside the visual suite.
        run: npm run test:e2e
      - name: Upload expected/actual/diff PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-fidelity-diffs
          # DM-1405: also upload features-results.json so the per-OS baseline can
          # be refreshed from a known-good run (scripts/seed-feature-baseline.mjs).
          path: |
            tests/output/*.png
            tests/output/features-results.json
            tests/output/run-env.json
          if-no-files-found: error

  # Declared-family match conformance oracle (doc 110): scores the transcribed
  # SkFontConfigInterfaceDirect::matchFamilyName in the Linux helper against
  # what Chrome-in-this-container actually paints, over CDP, and gates
  # REGRESSION-RELATIVE against tests/baselines/family-match-linux.json — an
  # env-keyed baseline set (tools/family-match-baseline.ts). The committed
  # baseline was recorded on arm64 (Docker on Apple Silicon); this runner is
  # x64 with a different font-inventory digest, so until a baseline recorded
  # HERE is committed the comparator refuses to judge (exit 3) — that case is
  # handled by recording a candidate and uploading it as an artifact (review
  # it, commit it, and the gate arms on the next run) while the job stays
  # green. A regression vs this environment's committed entry (exit 1), or a
  # setup failure (exit 2), fails the job. Also runs the armed seam test
  # (src/render/linux-declared-family-cut.test.ts): this is the one CI site
  # with the calibrated container fonts AND a built helper, so the
  # nomination-walk pins actually execute here rather than skipping.
  family-match:
    name: Linux family-match conformance
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install helper build dependencies
        # Container runs as root (no sudo). fontconfig headers are needed on
        # top of FreeType's: the helper links both (familyMatch + fcfallback).
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake pkg-config libfreetype-dev libfontconfig-dev
      - run: npm ci
      - name: Build the fontconfig/FreeType helper
        run: bash tools/linux-glyph-extractor/build.sh
      - name: Run the armed declared-family seam test
        run: npx vitest run src/render/linux-declared-family-cut.test.ts
      - name: Family-match conformance vs Chrome (regression-relative)
        shell: bash
        run: |
          set +e
          npx tsx tools/family-match-conformance-linux.ts
          code=$?
          set -e
          if [ "$code" = "3" ]; then
            echo "::notice title=Linux family-match::No committed baseline for this runner environment yet. Recording a candidate and uploading it as the family-match-linux artifact - review it, commit tests/baselines/family-match-linux.json, and this gate arms on the next run."
            npx tsx tools/family-match-conformance-linux.ts --write-baseline
            cp tests/baselines/family-match-linux.json family-match-linux.baseline-candidate.json
            exit 0
          fi
          exit $code
      - name: Upload conformance report (and baseline candidate on first run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-match-linux
          path: |
            tests/output/family-match-conformance-linux.json
            family-match-linux.baseline-candidate.json
          if-no-files-found: ignore

  # Compile the FreeType glyph extractor and run its fontkit-parity test against
  # the container's real Linux font stack. Release-independent validation of the
  # linux helper (release-helpers.yml builds + uploads the asset; this just
  # proves it compiles and matches fontkit) — run after editing the C++ to catch
  # build / coordinate issues without cutting a tag.
  glyph-extractor-build:
    if: github.event_name != 'pull_request'   # DM-1405: on-demand, not on every PR (see font-width-probe)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        # The container runs as root, so no sudo. FreeType + fontconfig dev
        # headers and a C++17 toolchain; libfreetype.so.6 and libfontconfig.so.1
        # are already present at runtime (Chromium needs both), but the helper
        # links against them at build time and CMakeLists.txt `find_package`s
        # Fontconfig, so the -dev packages are both required to configure.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake pkg-config libfreetype-dev libfontconfig-dev
      - run: npm ci
      - name: Build the FreeType helper
        run: bash tools/linux-glyph-extractor/build.sh
      - name: Smoke-test the helper (Liberation Sans H)
        run: |
          F=$(ls /usr/share/fonts/truetype/liberation/LiberationSans-Regular.ttf 2>/dev/null || echo /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf)
          printf '{"fonts":[{"ref":"f","fontPath":"%s","size":2048}],"queries":[{"type":"meta","fontRef":"f"},{"type":"glyphs","fontRef":"f","glyphs":[{"cp":72}]}]}' "$F" \
            | tools/linux-glyph-extractor/domotion-glyph-paths
      - name: Run the fontkit-parity test
        run: npx vitest run tests/linux-glyph-extractor.test.ts
