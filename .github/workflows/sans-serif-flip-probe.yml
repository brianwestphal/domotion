# Does Chrome's `sans-serif` generic resolve differently on different browser
# launches, on a CI runner's font inventory?
#
# This exists because the answer depends on the host's fonts and a developer Mac
# cannot produce it: 12 launches there gave Helvetica 12/12, on a machine with
# ~2,635 fonts against a runner's ~370. The choice is only marginal where the
# inventory is thin.
#
# What it is for: two conformance runs of one commit — same runner image, same
# font inventory digest, same Chromium build — disagreed wholesale on the
# `sans-serif` primary, and the same instability makes four unicode fixtures
# bistable across visual sweeps. That has already caused one regression to be
# attributed to the wrong commit.
#
# Diagnostic only: renders nothing, gates nothing, writes no baseline. Read the
# verdict out of the job log — every line is prefixed `SANSFLIP`.
name: sans-serif flip probe

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Runner OS'
        type: choice
        options: [macos, linux, windows]
        default: macos
      launches:
        description: 'Browser launches to sample (the flip is intermittent, so more is better)'
        type: string
        default: '20'
      settle_ms:
        description: 'Delay before the second, in-process ask (isolates timing from launch state)'
        type: string
        default: '750'
      concurrent:
        description: 'Browsers to launch simultaneously (0 skips). The harness runs a worker pool; sequential launches did not reproduce the flip.'
        type: string
        default: '6'
      runners:
        description: 'How many separate runner allocations to sample. 30/30 stable on ONE runner is consistent with the machine deciding, consistently.'
        type: choice
        options: ['1', '3', '6', '12', '20']
        default: '6'
      warm_coretext:
        description: 'Run the font inventory (which drives CoreText) BEFORE the probe. Setting this false is the point: the earlier runs warmed fontd first and may have hidden the flip.'
        type: choice
        options: ['true', 'false']
        default: 'true'

env:
  NODE_VERSION: '22'

jobs:
  # Fan out over SEPARATE runner allocations. A single runner answering 30/30
  # Helvetica does not distinguish "stable everywhere" from "each machine is
  # internally consistent but machines disagree" — and the flip was seen between
  # two runs of one commit, which is exactly two machine allocations.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: echo "matrix=$(node -e "console.log(JSON.stringify([...Array(${{ inputs.runners }}).keys()]))")" >> "$GITHUB_OUTPUT"

  probe:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        instance: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ inputs.os == 'macos' && 'macos-latest' || (inputs.os == 'windows' && 'windows-latest' || 'ubuntu-latest') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npx playwright install chromium
      # The font inventory IS one variable under test — a result is only
      # interpretable against the set that produced it.
      #
      # But running it FIRST also drives CoreText hard (it opens faces through
      # the native glyph helper), which warms macOS's font daemon before
      # Chromium ever launches. The first two probe runs did exactly that and
      # saw zero variation across 6 machines and ~800 samples. If the flip is a
      # cold-fontd effect, those runs disproved nothing — they warmed away the
      # thing they were looking for. Hence the toggle.
      - name: Font inventory (the variable under test)
        if: inputs.warm_coretext == 'true'
        run: npx tsx tools/font-env-probe.mjs
      # Which physical machine answered matters as much as the answer, since the
      # hypothesis under test is that the allocation decides.
      - name: Identify the machine
        run: |
          echo "SANSFLIP-HOST instance=${{ matrix.instance }} name=$(uname -n) arch=$(uname -m) cpus=$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo '?')"
          sw_vers 2>/dev/null || true
      - name: Sample the generic across launches
        env:
          LAUNCHES: ${{ inputs.launches }}
          SETTLE_MS: ${{ inputs.settle_ms }}
          CONCURRENT: ${{ inputs.concurrent }}
        run: node tools/probe-sans-serif-flip.mjs
      - name: Font inventory (after the probe, when not warming first)
        if: inputs.warm_coretext != 'true'
        run: npx tsx tools/font-env-probe.mjs
