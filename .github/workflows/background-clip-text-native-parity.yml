name: Background clip text native parity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/background-clip-text-*.ts"
      - "tests/background-clip-text-*.test.ts"
      - ".github/workflows/background-clip-text-native-parity.yml"

permissions:
  contents: read

jobs:
  collect:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            key: linux
          - os: windows-latest
            key: win32
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.0
          cache: npm
      - run: npm ci
      - name: Install headless Chromium
        run: npx playwright install chromium
      - name: Install Linux Chromium dependencies
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium
      - name: Run authenticated headless DPR1/2 oracle
        run: npm run background:clip-text-oracle -- --json tests/output/background-clip-text/${{ matrix.key }}/report.json --artifact-dir tests/output/background-clip-text/${{ matrix.key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: background-clip-text-${{ matrix.key }}
          path: tests/output/background-clip-text/${{ matrix.key }}
          if-no-files-found: error

  aggregate:
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.0
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: background-clip-text-*
          path: tests/output/background-clip-text/native
      - name: Require both authenticated native reports
        run: node --import tsx tools/background-clip-text-native-gate.ts tests/output/background-clip-text/native/background-clip-text-linux/report.json tests/output/background-clip-text/native/background-clip-text-win32/report.json
