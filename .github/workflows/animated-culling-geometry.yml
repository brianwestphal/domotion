name: Animated culling geometry

# Host-neutral geometry still needs a real Chromium compositor on every
# supported capture platform. Each leg persists its browser/OS/arch/Node/DPR
# fingerprint beside the row-level quad, ink, visibility, and mutation record.
on:
  pull_request:
    paths:
      - "src/animation/**"
      - "src/render/culling-geometry.ts"
      - "src/tree-ops/swept-transform-bounds.ts"
      - "src/tree-ops/viewbox-culling.ts"
      - "tools/animated-culling-geometry-oracle.ts"
      - "tools/parity-program.json"
      - "tools/semantic-coverage.json"
      - "package.json"
      - ".github/workflows/animated-culling-geometry.yml"
  push:
    branches: [main]
    paths:
      - "src/animation/**"
      - "src/render/culling-geometry.ts"
      - "src/tree-ops/swept-transform-bounds.ts"
      - "src/tree-ops/viewbox-culling.ts"
      - "tools/animated-culling-geometry-oracle.ts"
      - "tools/parity-program.json"
      - "tools/semantic-coverage.json"
      - "package.json"
      - ".github/workflows/animated-culling-geometry.yml"
  workflow_dispatch:

env:
  NODE_VERSION: "22.21.0"

jobs:
  oracle:
    name: ${{ matrix.label }} animated culling
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
          - os: ubuntu-latest
            label: Linux
          - os: windows-latest
            label: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Compare production culling with live Chromium geometry
        run: npm run culling:animated-geometry-oracle
      - name: Upload fingerprinted oracle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animated-culling-geometry-${{ runner.os }}
          path: tests/output/animated-culling-geometry-*.json
          if-no-files-found: error
