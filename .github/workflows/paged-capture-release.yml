name: Authenticated paged-capture release

on:
  workflow_dispatch:
    inputs:
      macos_bundle_url:
        description: Explicit URL for macOS output from paged-capture:helper:package
        required: true
        type: string
      macos_bundle_sha256:
        description: SHA-256 trust anchor for the macOS helper tarball
        required: true
        type: string
      linux_bundle_url:
        description: Explicit URL for the caller-built Linux helper tarball
        required: true
        type: string
      linux_bundle_sha256:
        description: SHA-256 trust anchor for the Linux helper tarball
        required: true
        type: string
      windows_bundle_url:
        description: Explicit URL for the caller-built Windows helper tarball
        required: true
        type: string
      windows_bundle_sha256:
        description: SHA-256 trust anchor for the Windows helper tarball
        required: true
        type: string

env:
  NODE_VERSION: "22.21.0"

jobs:
  collect:
    name: ${{ matrix.label }} proposal and validation
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            label: macOS
            executable: headless_shell
            bundle_url: ${{ inputs.macos_bundle_url }}
            bundle_sha256: ${{ inputs.macos_bundle_sha256 }}
          - runner: ubuntu-latest
            label: Linux
            executable: headless_shell
            bundle_url: ${{ inputs.linux_bundle_url }}
            bundle_sha256: ${{ inputs.linux_bundle_sha256 }}
          - runner: windows-latest
            label: Windows
            executable: headless_shell.exe
            bundle_url: ${{ inputs.windows_bundle_url }}
            bundle_sha256: ${{ inputs.windows_bundle_sha256 }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Install stock Chromium for negative, DPR, and downstream controls
        run: npx playwright install chromium
      - name: Install Linux Chromium dependencies
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium
      - name: Fetch only the explicitly supplied helper archive and authenticate it
        shell: bash
        env:
          HELPER_BUNDLE_URL: ${{ matrix.bundle_url }}
          HELPER_BUNDLE_SHA256: ${{ matrix.bundle_sha256 }}
        run: |
          mkdir -p release/helper
          curl --fail --location --silent --show-error "$HELPER_BUNDLE_URL" --output release/helper.tar.gz
          node --input-type=module -e 'import {createHash} from "node:crypto";import {readFileSync} from "node:fs";const actual=createHash("sha256").update(readFileSync(process.argv[1])).digest("hex");if(actual!==process.argv[2])throw new Error(`helper archive SHA-256 mismatch: ${actual}`)' release/helper.tar.gz "$HELPER_BUNDLE_SHA256"
          tar -xzf release/helper.tar.gz -C release/helper
          test -f release/helper/paged-capture-helper.json
          HELPER_MANIFEST_SHA256="$(node --input-type=module -e 'import {createHash} from "node:crypto";import {readFileSync} from "node:fs";process.stdout.write(createHash("sha256").update(readFileSync(process.argv[1])).digest("hex"))' release/helper/paged-capture-helper.json)"
          echo "HELPER_MANIFEST_SHA256=$HELPER_MANIFEST_SHA256" >> "$GITHUB_ENV"
      - name: Collect proposal logical record and exact native page SVGs
        shell: bash
        run: |
          npm run paged-page-record:smoke -- --release --binary "release/helper/${{ matrix.executable }}" --output release/proposal-smoke.json --fixture-output release/paged-capture-fixture.html
      - name: Publish proposal bundle through the public CLI
        shell: bash
        run: |
          node dist/cli/index.js capture release/paged-capture-fixture.html --paged --paged-helper-manifest release/helper/paged-capture-helper.json --paged-helper-sha256 "$HELPER_MANIFEST_SHA256" --prefer-css-page-size --output release/proposal/report.domotion-pages.json --quiet
      - name: Assemble proposal release evidence
        shell: bash
        run: |
          npm run paged-capture:release:collect -- --role proposal --helper-manifest release/helper/paged-capture-helper.json --helper-sha256 "$HELPER_MANIFEST_SHA256" --smoke release/proposal-smoke.json --bundle release/proposal/report.domotion-pages.json --out release/proposal/paged-capture-release.json
      - name: Collect independent validation capture
        shell: bash
        run: |
          npm run paged-page-record:smoke -- --release --binary "release/helper/${{ matrix.executable }}" --output release/validation-smoke.json --expected release/proposal-smoke.json --fixture-output release/paged-capture-fixture-validation.html
          node dist/cli/index.js capture release/paged-capture-fixture-validation.html --paged --paged-helper-manifest release/helper/paged-capture-helper.json --paged-helper-sha256 "$HELPER_MANIFEST_SHA256" --prefer-css-page-size --output release/validation/report.domotion-pages.json --quiet
          npm run paged-capture:release:collect -- --role validation --helper-manifest release/helper/paged-capture-helper.json --helper-sha256 "$HELPER_MANIFEST_SHA256" --smoke release/validation-smoke.json --bundle release/validation/report.domotion-pages.json --out release/validation/paged-capture-release.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paged-capture-${{ runner.os }}
          path: release/
          if-no-files-found: error

  adjudicate:
    name: Strict six-report terminal gate
    if: always()
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: paged-capture-*
          path: release/all-platforms
      - name: Require exact logical gates before native ink and PDF output
        run: npm run paged-capture:release:gate -- --reports release/all-platforms
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paged-capture-terminal-release-evidence
          path: release/all-platforms/
          if-no-files-found: error
