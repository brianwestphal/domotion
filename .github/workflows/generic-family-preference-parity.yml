name: Generic family preference parity

on:
  pull_request:
    paths:
      - "src/capture/generic-font-probe.ts"
      - "src/capture/generic-font-probe.test.ts"
      - "src/capture/index.ts"
      - "src/capture/types.ts"
      - "src/render/font-resolution.ts"
      - "src/render/element-tree-to-svg.ts"
      - "src/render/session-generic-overrides.test.ts"
      - "src/render/captured-generic-family-ownership.test.ts"
      - "tests/generic-font-probe.e2e.test.ts"
      - "tests/generic-family-preference-oracle.test.ts"
      - "tests/generic-family-preference-workflow.test.ts"
      - "tools/generic-family-preference-oracle.ts"
      - "tools/parity-program.json"
      - "tools/semantic-coverage.json"
      - "package.json"
      - ".github/workflows/generic-family-preference-parity.yml"
  push:
    branches: [main]
    paths:
      - "src/capture/generic-font-probe.ts"
      - "src/capture/index.ts"
      - "src/capture/types.ts"
      - "src/render/font-resolution.ts"
      - "src/render/element-tree-to-svg.ts"
      - "tools/generic-family-preference-oracle.ts"
      - "tools/parity-program.json"
      - "tools/semantic-coverage.json"
      - "package.json"
      - ".github/workflows/generic-family-preference-parity.yml"
  workflow_dispatch:

env:
  NODE_VERSION: "22.21.0"

jobs:
  parity:
    name: ${{ matrix.label }} live generic preferences
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
          - os: ubuntu-latest
            label: Linux
          - os: windows-latest
            label: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run sources:materialize
      - name: Install pinned Chromium, full Chrome, and Linux display dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium chrome
      - name: Install pinned Chromium (full Chrome is preinstalled)
        if: runner.os != 'Linux'
        run: npx playwright install chromium
      - name: Build macOS CoreText helper
        if: runner.os == 'macOS'
        run: bash tools/macos-glyph-extractor/build.sh
      - name: Build Linux fontconfig helper
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config libfreetype-dev libfontconfig-dev
          bash tools/linux-glyph-extractor/build.sh
      - name: Build Windows DirectWrite helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: tools/win32-glyph-extractor/build.ps1
      - name: Validate logical ownership and workflow contract
        run: npx vitest run src/capture/generic-font-probe.test.ts src/render/session-generic-overrides.test.ts src/render/captured-generic-family-ownership.test.ts tests/generic-family-preference-oracle.test.ts tests/generic-family-preference-workflow.test.ts
      - name: Run explicit hosted headless/headed/full-Chrome matrix under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run fonts:generic-preferences -- --allow-headed-browser --json generic-family-preference-${{ runner.os }}.json
      - name: Run explicit hosted headless/headed/full-Chrome matrix
        if: runner.os != 'Linux'
        run: npm run fonts:generic-preferences -- --allow-headed-browser --json generic-family-preference-${{ runner.os }}.json
      - name: Upload logical face, preference, source, and environment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generic-family-preference-${{ runner.os }}
          path: generic-family-preference-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 30
