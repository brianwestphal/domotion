# TEMPORARY throwaway-branch workflow (never merged): hosted-macOS repro for
# the first-capture "Unable to capture screenshot" failure.
name: tmp screenshot first-capture repro
on:
  push:
    branches: [tmp/screenshot-first-capture-repro]
jobs:
  repro:
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        parallel: [2, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.21.0" }
      - run: npm install --no-save --ignore-scripts @playwright/test@1.59.1
        working-directory: .github/tmp-repro
      - run: npx playwright install chromium
        working-directory: .github/tmp-repro
      - run: node probe.mjs
        working-directory: .github/tmp-repro
        env:
          ITERATIONS: "400"
          PARALLEL: ${{ matrix.parallel }}
          OUT: repro-${{ matrix.shard }}-${{ matrix.parallel }}.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repro-${{ matrix.shard }}-${{ matrix.parallel }}
          path: .github/tmp-repro/*.jsonl
