name: Font conformance oracle (synthetic stacks)

run-name: Synthetic font conformance · os=${{ inputs.os }} · byte=${{ inputs.sample_byte }} · max-stacks=${{ inputs.max_stacks }}

# The SYNTHETIC half of the font-conformance oracle. Same instrument, same shard
# script, same gate — a different stack corpus.
#
# WHY IT IS A SEPARATE DISPATCH RATHER THAN AN INPUT TO font-conformance.yml
#   The two sweeps ask different questions and must not share a baseline. The
#   default corpus is HARVESTED from the fixtures: 434 combinations, per
#   platform, dominated by weight 400 at 100% stretch. The synthetic corpus is
#   DERIVED FROM A RULE (tools/font-conformance-synthetic-stacks.ts): the CSS
#   generic-family keywords crossed with the weight ladder, the stretch keywords
#   normal/italic, keyword/literal spelling and content language — 50,544
#   stacks, identical on every platform.
#
#   That cross product multiplies an already expensive sweep, so folding it into
#   the default dispatch would make the canonical baseline slice unrunnable. It
#   also writes its own baselines (tests/baselines/font-conformance-synthetic-*),
#   because a mismatch count is meaningless without its slice and the comparator
#   refuses to compare across one.
#
# WHY IT IS WORTH RUNNING AT ALL
#   The oracle can make its codepoint axis exhaustive; its stack axis was bounded
#   by what the fixtures happen to contain. Measured on a 234-stack / 1,463-codepoint
#   slice on a developer Mac, the departures the harvested corpus never asks
#   about are where the defects are: `fantasy` measures 3 mismatches at 100%
#   stretch and 1,110 at each of 50 / 62.5 / 75 / 87.5% (Chrome takes
#   `Papyrus-Condensed`, we take `Papyrus`), and eight families measure 1-2
#   mismatches at weight 400 against 157 at weight 800/900.
#
# DEFAULT SLICE
#   `max_stacks: 351` is not arbitrary — the corpus is ordered by distance from
#   the CSS initial/default state, so 351 is exactly "every generic at its initial state,
#   plus every single-axis departure from it". On the codepoint axis, `00`
#   means every assigned codepoint ending in hex 00 across all Unicode planes.
#   It is a deterministic 1/256 sample; advancing through 00..FF eventually
#   covers the exhaustive universe exactly once. `all` is the expensive full
#   universe and is reserved for deliberate confidence/release sweeps.

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Platform to sweep — each has its own baseline'
        type: choice
        options: [macos, linux, windows, all]
        default: macos
      shards:
        description: 'Stack shards per platform. auto sizes sampled runs to 1 macOS / 1 Linux / 2 Windows; exhaustive runs use 8 / 6 / 16.'
        default: 'auto'
      max_stacks:
        description: 'Cap on synthetic stacks (ordered by distance from the CSS initial/default state). 13 = one per generic; 351 = +every single-axis departure; empty = all 50,544.'
        default: '351'
      stack_filter:
        description: 'Targeted rerun: case-insensitive substring of the full stack signature. Empty sweeps the selected matrix.'
        default: ''
      range:
        description: 'Expert override: contiguous codepoint range. Set sample_byte=all when using this.'
        default: ''
      sample_byte:
        description: 'Routine rotating sample: auto derives a deterministic bucket from the revision; 00..FF reruns one bucket; all runs the full universe.'
        default: 'auto'
      cp_shard:
        description: 'Codepoint stride index i, applied INSIDE every stack shard (used with cp_total). The stack axis is the expensive one here, so a stride keeps a wide stack slice affordable.'
        default: '1'
      cp_total:
        description: 'Codepoint stride denominator N. 1 (or empty) = the full universe, no stride. e.g. 50 sweeps every 50th codepoint.'
        default: '1'
      no_pua:
        description: 'Skip private-use codepoints (137k of 292k) for a faster run'
        type: boolean
        default: false
      update_baseline:
        description: 'Write this run back as the synthetic baseline instead of gating on it (artifact only — commit it by hand)'
        type: boolean
        default: false

env:
  NODE_VERSION: '22.21.0'
  STACKS_FILE: 'tools/font-conformance-stacks.synthetic.json'
  DOMOTION_CHROMIUM_REVISION: '7d859f27'
  DOMOTION_HARFBUZZ_REVISION: '4de187d'
  DOMOTION_SKIA_REVISION: '62efacd3'

concurrency:
  group: font-conformance-synthetic-${{ github.ref_name }}-${{ inputs.os }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      macos_matrix: ${{ steps.m.outputs.macos_matrix }}
      linux_matrix: ${{ steps.m.outputs.linux_matrix }}
      windows_matrix: ${{ steps.m.outputs.windows_matrix }}
      os_matrix: ${{ steps.m.outputs.os_matrix }}
      macos_on: ${{ steps.m.outputs.macos_on }}
      linux_on: ${{ steps.m.outputs.linux_on }}
      windows_on: ${{ steps.m.outputs.windows_on }}
      sample_byte: ${{ steps.m.outputs.sample_byte }}
      stack_bucket: ${{ steps.m.outputs.stack_bucket }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          requested="${{ inputs.shards }}"
          sample="${{ inputs.sample_byte }}"
          if [ "$sample" = auto ]; then
            rotation=$(node tools/font-conformance-rotation.mjs "$GITHUB_SHA" "$GITHUB_RUN_NUMBER")
            sample=$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(x.sampleByte)' "$rotation")
            stack_bucket=$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(x.stackBucket)' "$rotation")
          else
            stack_bucket=explicit
          fi
          echo "sample_byte=$sample" >> "$GITHUB_OUTPUT"
          echo "stack_bucket=$stack_bucket" >> "$GITHUB_OUTPUT"
          if [ "$requested" = auto ]; then
            if [ "$sample" = all ] || [ "$sample" = ALL ]; then
              macos_n=8
              linux_n=6
              windows_n=16
            else
              # Measured on byte 00 / 351 stacks: one macOS shard projects to
              # ~3m, one Linux shard to ~2m, and two Windows shards to ~7m.
              # More fan-out mostly recompiles helpers.
              macos_n=1
              linux_n=1
              windows_n=2
            fi
          elif [[ "$requested" =~ ^[1-9][0-9]*$ ]]; then
            macos_n="$requested"
            linux_n="$requested"
            windows_n="$requested"
          else
            echo "::error::shards must be 'auto' or a positive integer (got '$requested')"
            exit 2
          fi
          if [[ ! "$sample" =~ ^([0-9A-Fa-f]{2}|all|ALL)$ ]]; then
            echo "::error::sample_byte must be auto, 00..FF, or all (got '$sample')"
            exit 2
          fi
          if [ -n "${{ inputs.range }}" ] && [ "$sample" != all ] && [ "$sample" != ALL ]; then
            echo "::error::set sample_byte=all when supplying range"
            exit 2
          fi
          matrix() {
            local n="$1"
            local list
            list=$(seq 1 "$n" | paste -sd, -)
            printf '{"shard":[%s],"total":[%s]}' "$list" "$n"
          }
          echo "macos_matrix=$(matrix "$macos_n")" >> "$GITHUB_OUTPUT"
          echo "linux_matrix=$(matrix "$linux_n")" >> "$GITHUB_OUTPUT"
          echo "windows_matrix=$(matrix "$windows_n")" >> "$GITHUB_OUTPUT"
          sel="${{ inputs.os }}"
          on() { [ "$sel" = "$1" ] || [ "$sel" = "all" ] && echo true || echo false; }
          echo "macos_on=$(on macos)" >> "$GITHUB_OUTPUT"
          echo "linux_on=$(on linux)" >> "$GITHUB_OUTPUT"
          echo "windows_on=$(on windows)" >> "$GITHUB_OUTPUT"
          if [ "$sel" = "all" ]; then
            echo "os_matrix=[{\"os\":\"macos\",\"expected\":$macos_n},{\"os\":\"linux\",\"expected\":$linux_n},{\"os\":\"windows\",\"expected\":$windows_n}]" >> "$GITHUB_OUTPUT"
          else
            case "$sel" in
              macos) expected="$macos_n" ;;
              linux) expected="$linux_n" ;;
              windows) expected="$windows_n" ;;
            esac
            echo "os_matrix=[{\"os\":\"$sel\",\"expected\":$expected}]" >> "$GITHUB_OUTPUT"
          fi

  sweep-macos:
    needs: setup
    if: needs.setup.outputs.macos_on == 'true'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.macos_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npx playwright install chromium
        # Without the native helper the macOS per-codepoint fallback resolver
        # cannot ask CoreText and silently drops to the static chain.
      - name: Build the macOS glyph helper (CoreText fallback resolver)
        run: |
          swift build -c release --arch arm64 --package-path tools/macos-glyph-extractor
          cp tools/macos-glyph-extractor/.build/arm64-apple-macosx/release/DomotionGlyphPaths \
             tools/macos-glyph-extractor/domotion-glyph-paths
      # The corpus is gitignored on purpose: it is a pure function of the rule,
      # and a committed copy is a copy someone can hand-edit. Regenerating is
      # deterministic — its identity string is a digest of the rule's output, not
      # a timestamp — so a regenerated corpus stays comparable with the baseline.
      - name: Generate the synthetic stack corpus
        run: npx tsx tools/font-conformance-synthetic-stacks.ts
      - name: Sweep
        run: bash scripts/ci-font-conformance-shard.sh
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ matrix.total }}
          STACKS: ${{ env.STACKS_FILE }}
          RANGE: ${{ inputs.range }}
          SAMPLE_BYTE: ${{ needs.setup.outputs.sample_byte }}
          FONT_CONFORMANCE_REVISION: ${{ github.sha }}
          FONT_CONFORMANCE_ROTATION_ORDINAL: ${{ github.run_number }}
          FONT_CONFORMANCE_STACK_BUCKET: ${{ needs.setup.outputs.stack_bucket }}
          MAX_STACKS: ${{ inputs.max_stacks }}
          STACK_FILTER: ${{ inputs.stack_filter }}
          NO_PUA: ${{ inputs.no_pua }}
          CP_SHARD: ${{ inputs.cp_shard }}
          CP_TOTAL: ${{ inputs.cp_total }}
      - name: Secondary logical parity matrix (clusters, webfonts, variable axes)
        if: matrix.shard == 1 && inputs.sample_byte == 'auto'
        run: |
          npm run fonts:cluster-conformance
          if DOMOTION_CLUSTER_FALLBACK=0 npm run fonts:cluster-conformance; then
            echo "::error::cluster fallback negative control did not move"
            exit 1
          fi
          npm run test:e2e -- tests/variable-axis-oracle-pair.e2e.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: font-conformance-synthetic-macos-shard-${{ matrix.shard }}
          path: tests/output/font-conformance/
          retention-days: 14

  sweep-linux:
    needs: setup
    if: needs.setup.outputs.linux_on == 'true'
    runs-on: ubuntu-latest
    # The pinned Playwright image, not a bare ubuntu-latest: the Linux fallback
    # answer IS the container's fontconfig set, so a different image is a
    # different oracle.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.linux_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Build the Linux glyph helper (fontconfig fallback resolver)
        run: |
          apt-get update -qq
          apt-get install -y -qq build-essential cmake libfreetype-dev libfontconfig1-dev pkg-config
          cmake -S tools/linux-glyph-extractor -B /tmp/lgx -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/lgx -j
          cp /tmp/lgx/domotion-glyph-paths tools/linux-glyph-extractor/domotion-glyph-paths
          test "$(tools/linux-glyph-extractor/domotion-glyph-paths --fontconfig-mode)" = '{"fontations":true,"configReady":true}'
      - name: Generate the synthetic stack corpus
        run: npx tsx tools/font-conformance-synthetic-stacks.ts
      - name: Sweep
        run: bash scripts/ci-font-conformance-shard.sh
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ matrix.total }}
          STACKS: ${{ env.STACKS_FILE }}
          RANGE: ${{ inputs.range }}
          SAMPLE_BYTE: ${{ needs.setup.outputs.sample_byte }}
          FONT_CONFORMANCE_REVISION: ${{ github.sha }}
          FONT_CONFORMANCE_ROTATION_ORDINAL: ${{ github.run_number }}
          FONT_CONFORMANCE_STACK_BUCKET: ${{ needs.setup.outputs.stack_bucket }}
          MAX_STACKS: ${{ inputs.max_stacks }}
          STACK_FILTER: ${{ inputs.stack_filter }}
          NO_PUA: ${{ inputs.no_pua }}
          CP_SHARD: ${{ inputs.cp_shard }}
          CP_TOTAL: ${{ inputs.cp_total }}
      - name: Secondary logical parity matrix (clusters, webfonts, variable axes)
        if: matrix.shard == 1 && inputs.sample_byte == 'auto'
        run: |
          npm run fonts:cluster-conformance
          if DOMOTION_CLUSTER_FALLBACK=0 npm run fonts:cluster-conformance; then
            echo "::error::cluster fallback negative control did not move"
            exit 1
          fi
          npm run test:e2e -- tests/variable-axis-oracle-pair.e2e.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: font-conformance-synthetic-linux-shard-${{ matrix.shard }}
          path: tests/output/font-conformance/
          retention-days: 14

  sweep-windows:
    needs: setup
    if: needs.setup.outputs.windows_on == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.windows_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npx playwright install chromium
      - name: Build the DirectWrite glyph helper (fallback resolver)
        shell: pwsh
        run: ./tools/win32-glyph-extractor/build.ps1
      - name: Generate the synthetic stack corpus
        run: npx tsx tools/font-conformance-synthetic-stacks.ts
      - name: Sweep
        shell: bash
        run: bash scripts/ci-font-conformance-shard.sh
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ matrix.total }}
          STACKS: ${{ env.STACKS_FILE }}
          RANGE: ${{ inputs.range }}
          SAMPLE_BYTE: ${{ needs.setup.outputs.sample_byte }}
          FONT_CONFORMANCE_REVISION: ${{ github.sha }}
          FONT_CONFORMANCE_ROTATION_ORDINAL: ${{ github.run_number }}
          FONT_CONFORMANCE_STACK_BUCKET: ${{ needs.setup.outputs.stack_bucket }}
          MAX_STACKS: ${{ inputs.max_stacks }}
          STACK_FILTER: ${{ inputs.stack_filter }}
          NO_PUA: ${{ inputs.no_pua }}
          CP_SHARD: ${{ inputs.cp_shard }}
          CP_TOTAL: ${{ inputs.cp_total }}
      - name: Secondary logical parity matrix (clusters, webfonts, variable axes)
        if: matrix.shard == 1 && inputs.sample_byte == 'auto'
        shell: bash
        run: |
          npm run fonts:cluster-conformance
          if DOMOTION_CLUSTER_FALLBACK=0 npm run fonts:cluster-conformance; then
            echo "::error::cluster fallback negative control did not move"
            exit 1
          fi
          npm run test:e2e -- tests/variable-axis-oracle-pair.e2e.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: font-conformance-synthetic-windows-shard-${{ matrix.shard }}
          path: tests/output/font-conformance/
          retention-days: 14

  aggregate:
    needs: [setup, sweep-macos, sweep-linux, sweep-windows]
    if: always() && needs.setup.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.os_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - uses: actions/download-artifact@v4
        with:
          path: shards
          pattern: 'font-conformance-synthetic-${{ matrix.os }}-shard-*'
      - name: Merge shard reports
        run: |
          node scripts/merge-font-conformance-shards.mjs \
            --shards shards \
            --os ${{ matrix.os }} \
            --expected ${{ matrix.expected }} \
            --out merged.json
      # Its OWN baseline. The synthetic slice and the harvested slice measure
      # different questions, and the comparator would refuse to compare them
      # anyway (`slice.stacks` and the corpus identity both differ) — this makes
      # that separation explicit rather than relying on the refusal.
      - name: Gate vs the synthetic baseline for this platform
        shell: bash
        run: |
          sample="${{ needs.setup.outputs.sample_byte }}"
          range="${{ inputs.range }}"
          if [ -n "$range" ]; then
            # A diagnostic range is its own slice too. Hash the spelling into
            # the artifact filename so updating it can never overwrite the
            # authoritative exhaustive baseline.
            range_id=$(printf '%s' "$range" | sha256sum | cut -c1-12)
            baseline="tests/baselines/font-conformance-synthetic-${{ matrix.os }}-range-${range_id}.json"
            label="range ${range}"
          elif [ "$sample" = all ] || [ "$sample" = ALL ]; then
            # Preserve the established exhaustive baseline names. Sampled
            # buckets are separate measurements and get explicit suffixes.
            baseline="tests/baselines/font-conformance-synthetic-${{ matrix.os }}.json"
            label="full"
          else
            sample="${sample^^}"
            baseline="tests/baselines/font-conformance-synthetic-${{ matrix.os }}-byte-${sample}.json"
            label="low-byte ${sample}"
          fi
          node scripts/diff-font-conformance-baseline.mjs \
            --results merged.json \
            --baseline "$baseline" \
            --label "${{ matrix.os }} / font-conformance (synthetic stacks, $label)" \
            ${{ inputs.update_baseline && '--update-baseline' || '--strict' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: font-conformance-synthetic-${{ matrix.os }}-merged
          path: |
            merged.json
            tests/baselines/font-conformance-synthetic-${{ matrix.os }}.json
            tests/baselines/font-conformance-synthetic-${{ matrix.os }}-*.json
          retention-days: 30
