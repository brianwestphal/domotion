<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Launch Glassbox</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1280px; height: 800px; margin: 0; overflow: hidden; }
    body { background: #0d1117; color: #c9d1d9; font: 24px/1.65 ui-monospace, "SF Mono", Menlo, monospace; padding: 74px 88px; }
    .dim { color: #768390; }
    .prompt { color: #3fb950; }
    .command { color: #f0f4fa; }
    .accent { color: #79c0ff; }
    .ready { margin-top: 42px; padding: 22px 28px; border: 1px solid #30363d; border-radius: 12px; background: #161b22; }
    .caret { display: inline-block; width: 13px; height: 26px; margin-left: 7px; vertical-align: -4px; background: #79c0ff; animation: blink 900ms steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>
  <div><span class="prompt">$</span> <span class="command">git status --short</span></div>
  <div class="dim"> M src/auth/session.ts</div>
  <div class="dim"> M src/db/redis.ts</div>
  <br>
  <div><span class="prompt">$</span> <span class="command">npx glassbox</span><span class="caret"></span></div>
  <div class="ready"><span class="accent">Glassbox</span> opened a local review for 8 changed files.<br><span class="dim">http://127.0.0.1:4188</span></div>
</body>
</html>
